<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仰望星空 (Stargazing) - 终极修复版</title>
    <style>
        /* --- 核心基础样式 --- */
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
            color: #e2e8f0; margin: 0; padding: 0; height: 100vh; overflow: hidden;
            user-select: none;
        }
        
        #main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 60px 1fr 240px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .panel { 
            background: rgba(30, 41, 59, 0.85); 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        /* 顶部标题栏 */
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #facc15; }
        h1 { margin: 0; font-size: 24px; color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        .status-badge { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 0 5px #3b82f6; }

        /* 左侧边栏 */
        aside { grid-row: 2 / -1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        #scoreboard { flex: 1; overflow-y: auto; font-size: 13px; }
        #scoreboard table { width: 100%; border-collapse: collapse; }
        #scoreboard th { text-align: left; color: #94a3b8; border-bottom: 1px solid #475569; padding: 5px; }
        #scoreboard td { padding: 8px 5px; border-bottom: 1px solid #334155; vertical-align: top; }
        
        /* 组合 Token 样式 (可点击用于陨石攻击) */
        .combo-token { 
            display: inline-block; background: #475569; padding: 3px 6px; 
            border-radius: 4px; font-size: 11px; margin: 2px; 
            border: 1px solid #64748b; cursor: default;
        }
        .combo-token.targetable {
            cursor: pointer; border-color: #ef4444; background: #450a0a; color: #fca5a5;
            animation: shake 0.5s infinite;
        }
        .combo-token.targetable:hover { background: #ef4444; color: white; transform: scale(1.1); }

        #game-log { height: 180px; background: #000; color: #4ade80; font-family: 'Consolas', monospace; padding: 8px; border-radius: 6px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; }

        /* 中央游戏区 */
        #game-center { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; padding-top: 20px; }
        #opponents-area { display: flex; justify-content: space-around; width: 100%; }
        .opponent { text-align: center; opacity: 0.8; transition: all 0.3s; position: relative; min-width: 120px; }
        .opponent.active { opacity: 1; transform: scale(1.05); }
        .opponent.active::after { content: '⏳ 思考中...'; position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #facc15; white-space: nowrap; }
        
        /* 玩家区域 */
        #player-area { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; position: relative; }
        .card-container { display: flex; gap: -10px; justify-content: center; padding: 10px; min-height: 140px; perspective: 1000px; }
        
        /* 卡牌实体 */
        .card {
            width: 110px; height: 160px; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; cursor: pointer; position: relative;
            border: 2px solid #64748b; text-align: center; padding: 8px; box-sizing: border-box;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: #cbd5e1; color: #1e293b;
            margin: 0 5px;
        }
        .card:hover { transform: translateY(-20px) scale(1.05); z-index: 50; border-color: #fff; }
        .card.selected { border-color: #facc15; box-shadow: 0 0 20px #facc15; transform: translateY(-30px) scale(1.1); z-index: 60; }
        .card-desc { font-size: 10px; margin-top: 8px; font-weight: normal; opacity: 0.9; line-height: 1.2; }

        /* 卡牌配色 */
        .type-Star { background: linear-gradient(135deg, #fef08a, #facc15); color: #422006; }
        .type-Meteor { background: linear-gradient(135deg, #bae6fd, #3b82f6); color: #172554; }
        .type-Meteorite { background: linear-gradient(135deg, #94a3b8, #475569); color: #f8fafc; border-color: #cbd5e1; }
        .type-Astronaut { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); color: #0f172a; }
        .type-Rocket { background: linear-gradient(135deg, #fecaca, #ef4444); color: #450a0a; }
        .type-Event { background: linear-gradient(135deg, #e9d5ff, #a855f7); color: #3b0764; }
        .type-Objective { background: linear-gradient(135deg, #6ee7b7, #059669); color: #fff; width: 160px; height: 220px; }
        .type-Ultimate { background: linear-gradient(135deg, #f472b6, #db2777); color: #fff; border: 2px solid #facc15; }

        /* UI 控件 */
        .btn-group { margin-top: 5px; display: flex; gap: 15px; }
        button { 
            padding: 12px 35px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; 
            background: linear-gradient(to bottom, #facc15, #eab308); color: #422006; 
            font-weight: 800; box-shadow: 0 4px 0 #854d0e; transition: all 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        button:disabled { background: #64748b; color: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
        button.secondary { background: #475569; color: #fff; box-shadow: 0 4px 0 #1e293b; }

        /* 目标显示区 */
        #objective-hud {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(6, 78, 59, 0.8); border: 1px solid #10b981;
            padding: 12px; border-radius: 8px; width: 220px;
            font-size: 12px; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
            z-index: 80; pointer-events: none;
        }

        /* 模态框系统 */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 200; display: flex; 
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 16px; border: 2px solid #facc15; text-align: center; max-width: 800px; box-shadow: 0 0 50px rgba(250, 204, 21, 0.2); }
        .modal-title { font-size: 24px; color: #facc15; margin-bottom: 20px; }
        .modal-choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        /* 轮抽遮罩 */
        #draft-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* 瞄准模式遮罩 */
        #targeting-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.1); border: 4px solid #ef4444;
            pointer-events: none; z-index: 150; box-sizing: border-box;
            display: flex; justify-content: center; padding-top: 100px;
        }
        #targeting-msg {
            background: #ef4444; color: white; padding: 10px 30px; font-weight: bold; font-size: 20px;
            border-radius: 30px; pointer-events: auto; animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

<div id="modal-window" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 id="modal-title" class="modal-title">标题</h2>
        <p id="modal-desc" style="color:#cbd5e1; margin-bottom:20px;">描述文字</p>
        <div id="modal-body" class="modal-choices"></div>
        <div id="modal-actions" style="margin-top:20px;"></div>
    </div>
</div>

<div id="targeting-overlay" style="display:none;">
    <div id="targeting-msg">☄️ 陨石打击：请点击左侧计分板，选择一个对手的组合进行摧毁！</div>
</div>

<div id="main-layout">
    <header>
        <div>
            <h1>仰望星空 <span style="font-size:14px; color:#94a3b8; font-weight:normal">Stargazing Remastered</span></h1>
        </div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div class="status-badge" id="round-badge">Round 1 / 4</div>
            <div class="status-badge" style="background:#ef4444" id="phase-badge">加载中</div>
        </div>
    </header>

    <aside class="panel">
        <h3 style="color:#facc15; margin-top:0; border-bottom:1px solid #475569; padding-bottom:10px;">📊 实时战况</h3>
        <div id="scoreboard">
            <table>
                <thead><tr><th>玩家</th><th>分数</th><th>已打出组合 (本局)</th></tr></thead>
                <tbody id="score-body"></tbody>
            </table>
        </div>
        <div style="margin-top:10px; font-weight:bold; color:#94a3b8;">游戏日志</div>
        <div id="game-log"></div>
    </aside>

    <div id="game-center">
        <div id="draft-overlay" style="display:none;">
            <div style="color:#facc15; font-size:24px; margin-bottom:10px; font-weight:bold;">🔄 轮抽阶段 (Draft Phase)</div>
            <div style="color:#cbd5e1; margin-bottom:30px;">请从下方卡包中选择 1 张保留，剩余的将传给下家</div>
            <div id="draft-container" class="card-container"></div>
        </div>

        <div id="opponents-area"></div>
    </div>

    <div id="player-area" class="panel">
        <div id="player-hand" class="card-container"></div>
        <div class="btn-group">
            <button onclick="attemptPlay()" id="btn-play" disabled>打出组合</button>
            <button onclick="passTurn()" class="secondary" id="btn-pass" disabled>跳过回合</button>
        </div>
        <div id="objective-hud">目标: 等待选择...</div>
    </div>
</div>

<script>
    /* ================= 1. 数据定义 ================= */
    const CARD_DEFINITIONS = [
        { type: 'Star', name: '星星', count: 14, score: 1, desc: '3张=星座(+5分)' },
        { type: 'Meteor', name: '流星', count: 9, score: 1, desc: '3张=许愿' },
        { type: 'Meteorite', name: '陨石', count: 6, score: 0, desc: '配星星=摧毁组合' },
        { type: 'Astronaut', name: '太空人', count: 6, score: 1, desc: '配火箭=登月(+4分)' },
        { type: 'Rocket', name: '火箭', count: 6, score: 1, desc: '配太空人=登月(+4分)' },
        { type: 'Event', name: '事件:星雨', count: 1, isEvent: true, effect: 'draw2', desc: '打出抽2张牌' },
        { type: 'Event', name: '事件:黑洞', count: 1, isEvent: true, effect: 'blackhole', desc: '全场弃1张重洗' },
        { type: 'Event', name: '事件:流星雨', count: 1, isEvent: true, effect: 'meteorShower', desc: '配1流星+弃1牌=许愿' },
        { type: 'Event', name: '事件:星辰闪耀', count: 1, isEvent: true, effect: 'scoreStars', desc: '本回合星星组合+3分' },
        { type: 'Event', name: '事件:摘星揽月', count: 1, isEvent: true, effect: 'drawRocket', desc: '本回合火箭组合抽1张' },
        { type: 'Event', name: '事件:小行星带', count: 1, isEvent: true, effect: 'drawStone', desc: '本回合陨石组合抽1张' }
    ];

const BASIC_OBJECTIVES = [
        { name: '仙女座星系', desc: '3组流星 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Meteor').length>=3 },
        { name: '蜂巢星系', desc: '4组星星 (+12分)', bonus: 12, check: (c)=>c.filter(x=>x.type==='Star').length>=4 },
        { name: '漩涡星系', desc: '2星星+2流星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Meteor').length>=2 },
        { name: '触须星系', desc: '2陨石+2火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Attack').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '车轮星系', desc: '2星星+2陨石 (+13分)', bonus: 13, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '喷流星系', desc: '4组火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Moon').length>=4 },
        { name: '猎户星云', desc: '2流星+2火箭 (+16分)', bonus: 16, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        // --- 新增目标卡 ---
        { name: '草帽星系', desc: '2组流星+2组陨石 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Attack').length>=2 }
    ];

    const ULTIMATE_OBJECTIVES = [
        { name: '河外丝状结构', desc: '4组星星, 2组流星, 1组陨石或火箭 (+30分)', bonus: 30, type: 'Ultimate' },
        { name: '宇宙网', desc: '2组星星, 2组流星, 2组陨石, 2组火箭 (+40分)', bonus: 40, type: 'Ultimate' }
    ];

    let state = {
        round: 1,
        maxRounds: 6,
        players: [],
        deck: [],
        discardPile: [],
        ultimateDeck: [], // 终极目标堆
        draftPacks: [],
        currentPlayer: 0,
        passedPlayers: new Set(),
        gamePhase: 'INIT', // INIT, DRAFT, PLAY, TARGETING, END
        targetingMode: false // 是否处于陨石瞄准模式
    };

    /* ================= 2. 初始化逻辑 ================= */
    
    function initGame() {
        log(">>> 游戏初始化...");
        state.deck = createDeck();
        state.ultimateDeck = shuffle([...ULTIMATE_OBJECTIVES]); // 初始化终极目标堆
        
        state.players = [
            { id: 0, name: "你", isHuman: true, hand: [], score: 0, combos: [], objective: null, tempScore: 0 },
            { id: 1, name: "电脑 A", isHuman: false, hand: [], score: 0, combos: [], objective: null, tempScore: 0 },
            { id: 2, name: "电脑 B", isHuman: false, hand: [], score: 0, combos: [], objective: null, tempScore: 0 },
            { id: 3, name: "电脑 C", isHuman: false, hand: [], score: 0, combos: [], objective: null, tempScore: 0 }
        ];

        assignObjectives();
    }

    function createDeck() {
        let newDeck = [];
        CARD_DEFINITIONS.forEach(def => {
            for(let i=0; i<def.count; i++) newDeck.push({ ...def, uid: Math.random().toString(36).substr(2, 9) });
        });
        return shuffle(newDeck);
    }

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    // [Bug修复] 目标卡二选一
    function assignObjectives() {
        let objDeck = shuffle([...BASIC_OBJECTIVES]);
        
        // 电脑随机发
        for(let i=1; i<4; i++) { state.players[i].objective = objDeck.pop(); objDeck.pop(); }

        // 玩家二选一
        // 确保弹出两张不同的卡
        const choice1 = objDeck.pop();
        const choice2 = objDeck.pop();

        if(!choice1 || !choice2) { alert("Error: 目标卡牌堆不足"); return; }

        showModal("选择你的目标", "请从以下两张目标卡中选择一张保留。该目标将在游戏结束时结算加分。", 
            [choice1, choice2].map(c => ({...c, type:'Objective'})),
            (selectedIndex) => {
                const selected = [choice1, choice2][selectedIndex];
                state.players[0].objective = selected;
                document.getElementById('objective-hud').innerHTML = `<strong style="color:#facc15">${selected.name}</strong><br>${selected.desc}`;
                log(`你选择了目标：${selected.name}`);
                hideModal();
                startRound();
            }
        );
    }

    /* ================= 3. 轮抽与回合流程 ================= */

    function startRound() {
        if(state.round > state.maxRounds) { endGame(); return; }
        
        state.gamePhase = 'DRAFT';
        state.passedPlayers.clear();
        state.players.forEach(p => { p.passed = false; p.hand = []; }); // 只有实体手牌清空，combos记录保留（但实体卡稍后回收）
        
        updateUI();
        log(`=== 第 ${state.round} 回合：轮抽阶段 ===`);

        // 发牌：每人7张
        state.draftPacks = [[], [], [], []];
        for(let i=0; i<4; i++) {
            for(let j=0; j<7; j++) { if(state.deck.length > 0) state.draftPacks[i].push(state.deck.pop()); }
        }

        runDraftUI();
    }

    function runDraftUI() {
        if(state.players[0].hand.length >= 7) {
            log("轮抽结束，进入出牌阶段！");
            document.getElementById('draft-overlay').style.display = 'none';
            state.gamePhase = 'PLAY';
            state.currentPlayer = 0;
            updateUI();
            checkTurn();
            return;
        }

        document.getElementById('draft-overlay').style.display = 'flex';
        const container = document.getElementById('draft-container');
        container.innerHTML = '';
        
        // 显示当前包
        state.draftPacks[0].forEach((card, idx) => {
            const el = createCardElement(card);
            el.onclick = () => {
                // 玩家拿牌
                state.players[0].hand.push(state.draftPacks[0].splice(idx, 1)[0]);
                // 电脑拿牌
                aiDraft();
                // 传牌 (顺时针: 3->0, 0->1, 1->2, 2->3)
                const last = state.draftPacks.pop();
                state.draftPacks.unshift(last);
                
                runDraftUI();
            };
            container.appendChild(el);
        });
    }

    function aiDraft() {
        for(let i=1; i<4; i++) {
            const pack = state.draftPacks[i];
            if(pack.length > 0) {
                // AI简单逻辑：优先星星/流星
                let pick = pack.findIndex(c => c.type === 'Star');
                if(pick === -1) pick = 0;
                state.players[i].hand.push(pack.splice(pick, 1)[0]);
            }
        }
    }

    /* ================= 4. 出牌逻辑 ================= */

    function checkTurn() {
        updateUI();
        if(state.passedPlayers.size === 4) { endRoundLogic(); return; }

        const curr = state.players[state.currentPlayer];
        if(curr.passed) { nextTurn(); return; }

        if(!curr.isHuman) {
            document.querySelectorAll('.opponent')[curr.id-1].classList.add('active');
            setTimeout(() => aiPlay(curr), 800);
        } else {
            // 玩家回合
            document.querySelectorAll('.opponent').forEach(e=>e.classList.remove('active'));
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-pass').disabled = false;
            log("👉 轮到你了！");
        }
    }

    function attemptPlay() {
        const hand = state.players[0].hand;
        const selected = hand.filter(c => c.selected);
        if(selected.length === 0) return alert("请先选牌！");

        const res = validateCombo(selected);
        if(res.valid) {
            // [修复] 流星雨弃牌逻辑：需要选3张：事件+流星+任意一张废牌
            if(res.reqDiscard) {
                if(selected.length !== 3) return alert("【流星雨事件】规则：\n需选择3张牌：\n1.流星雨事件牌\n2.一张流星牌\n3.一张作为代价弃掉的手牌");
                // 自动识别哪张是废牌：不是事件且不是必须的那张流星
                const rain = selected.find(c=>c.name.includes('流星雨'));
                const meteor = selected.find(c=>c.type==='Meteor');
                // 剩下的就是废牌
                if(!rain || !meteor) return alert("组合必须包含流星雨事件卡和一张流星卡！");
            }
            executePlay(0, selected, res);
        } else {
            alert("❌ 无效组合: " + res.reason);
        }
    }

    function validateCombo(cards) {
        const types = cards.map(c => c.type);
        const len = cards.length;
        
        // 1. 事件 (单张)
        if(len === 1 && cards[0].isEvent) {
            if(cards[0].effect === 'meteorShower') return {valid:false, reason:"流星雨事件卡不能单独打出，需配合流星使用 "};
            return {valid:true, type:'Event', data:cards[0]};
        }
        // 2. 星座
        if(len===3 && types.every(t=>t==='Star')) return {valid:true, type:'Star', name:'星座组合', endScore:5};
        // 3. 流星许愿
        if(len===3 && types.every(t=>t==='Meteor')) return {valid:true, type:'Meteor', name:'流星许愿', endScore:3};
        // 4. [修复] 流星雨事件组合
        if(cards.some(c=>c.effect==='meteorShower') && len===3) {
            // 需包含流星雨+流星
            if(types.includes('Meteor') && types.includes('Event')) 
                return {valid:true, type:'Meteor', name:'流星雨(事件)', endScore:3, reqDiscard:true};
        }
        // 5. 登月
        if(len===2 && types.includes('Astronaut') && types.includes('Rocket')) return {valid:true, type:'Moon', name:'登月成功', endScore:4};
        // 6. 陨石打击
        if(len===2 && types.includes('Meteorite') && types.includes('Star')) return {valid:true, type:'Attack', name:'陨石打击', endScore:0};

        return {valid:false, reason:"不符合任何规则"};
    }

    function executePlay(pid, cards, combo) {
        const p = state.players[pid];
        
        // 移除手牌
        p.hand = p.hand.filter(h => !cards.some(c => c.uid === h.uid));
        
        // 处理流星雨弃牌
        let displayCards = [...cards];
        if(combo.reqDiscard) {
            const discard = cards.find(c => c.type !== 'Meteor' && c.effect !== 'meteorShower');
            if(discard) {
                state.discardPile.push(discard);
                displayCards = cards.filter(c => c !== discard); // 组合里只记录有效的
            }
        }

        // 事件牌立刻进弃牌堆，非事件进Combo区
        if(combo.type === 'Event') {
            state.discardPile.push(cards[0]);
            log(`${p.name} 发动事件：${combo.data.name}`);
            applyEventEffect(pid, combo.data.effect);
        } else {
            // [关键] 记录 combo 所属回合，用于“本回合”事件判定
            p.combos.push({ 
                name: combo.name, 
                type: combo.type, 
                endScore: combo.endScore, 
                cards: displayCards, 
                round: state.round // 记录回合数
            });
            p.score += (combo.score || 0);
            log(`${p.name} 打出 [${combo.name}]`);

            // 组合即时效果
            if(combo.type === 'Attack') {
                if(pid === 0) {
                    p.score += 1; // 规则: 自己立即+1分
                    enterTargetingMode(); // [修复] 手动瞄准
                    return; // 瞄准模式会暂停流程
                } else {
                    p.score += 1;
                    aiMeteorStrike(pid);
                }
            }
            if(combo.type === 'Moon') drawCards(pid, 1);
            if(combo.type === 'Meteor') handleWish(pid);
        }
        
        updateUI();
        if(state.gamePhase !== 'TARGETING') nextTurn();
    }

    // [修复] 事件效果逻辑
    function applyEventEffect(pid, effect) {
        const p = state.players[pid];
        
        if(effect === 'draw2') drawCards(pid, 2);
        
        if(effect === 'blackhole') {
            state.players.forEach(pl => {
                if(pl.id !== pid && pl.hand.length > 0) {
                    state.deck.push(pl.hand.pop()); // 随机弃一张
                }
            });
            shuffle(state.deck);
            log("黑洞触发：全场对手各弃一张牌并重洗牌库！");
        }
        
        // [修复] 摘星揽月：检查本回合(this round)打出的 Moon 组合
        if(effect === 'drawRocket') {
            const count = p.combos.filter(c => c.type === 'Moon' && c.round === state.round).length;
            if(count > 0) {
                drawCards(pid, count);
                log(`摘星揽月生效！因本回合打出 ${count} 组火箭，抽 ${count} 张牌 [cite: 30]`);
            } else {
                log("摘星揽月生效，但本回合未打出火箭组合，无法抽牌。");
            }
        }

        // [修复] 小行星带：检查本回合打出的 Attack (陨石) 组合
        if(effect === 'drawStone') {
            const count = p.combos.filter(c => c.type === 'Attack' && c.round === state.round).length;
            if(count > 0) {
                // 规则书 [cite: 31] 说"摸一张牌" (let you draw a card)。
                // 这里的"每组...可以让你摸一张" = count * 1
                drawCards(pid, count);
                log(`小行星带生效！因本回合打出 ${count} 组陨石，抽 ${count} 张牌`);
            } else {
                log("小行星带生效，但本回合未打出陨石组合。");
            }
        }

        if(effect === 'scoreStars') {
            const count = p.combos.filter(c => c.type === 'Star' && c.round === state.round).length;
            p.score += count * 3;
            log(`星辰闪耀！本回合 ${count} 组星星带来 +${count*3} 分`);
        }
    }

    // [新增] 终极目标与许愿
    function handleWish(pid) {
        if(pid === 0) {
            // 玩家许愿 UI
            showModal("🌠 流星许愿", "请选择你的愿望 [cite: 22]", 
                [
                    {name:'贪婪', desc:'抽 2 张牌', icon:'🃏'}, 
                    {name:'声望', desc:'立即 +3 分', icon:'🏆'},
                    {name:'野心', desc:'抽取 1 张终极目标卡', icon:'📜'} // [新增]
                ].map(x=>({...x, type:'Event'})), // 伪装成卡牌样式渲染
                (idx) => {
                    hideModal();
                    if(idx===0) { drawCards(0, 2); log("许愿：抽了2张牌"); }
                    if(idx===1) { state.players[0].score += 3; log("许愿：获得3分"); }
                    if(idx===2) {
                        if(state.ultimateDeck.length > 0) {
                            const ult = state.ultimateDeck.pop();
                            state.players[0].combos.push({name: '终极目标', type:'Ultimate', data: ult, endScore:0}); // 存入combo区展示，但不立即加分
                            alert(`你获得了终极目标：${ult.name}\n${ult.desc}`);
                            log(`许愿：获得了终极目标 [${ult.name}]`);
                        } else {
                            alert("终极目标卡已发完！补偿抽2张牌。");
                            drawCards(0, 2);
                        }
                    }
                    updateUI();
                }
            );
        } else {
            // AI许愿
            if(state.players[pid].hand.length < 3) drawCards(pid, 2);
            else state.players[pid].score += 3;
        }
    }

    function drawCards(pid, num) {
        for(let i=0; i<num; i++) {
            if(state.deck.length>0) state.players[pid].hand.push(state.deck.pop());
        }
    }

    /* ================= 5. 陨石瞄准系统 (新增) ================= */
    
    function enterTargetingMode() {
        state.gamePhase = 'TARGETING';
        state.targetingMode = true;
        document.getElementById('targeting-overlay').style.display = 'flex';
        updateUI(); // 触发UI刷新，给Token添加可点击样式
        // 游戏暂停，等待点击 scoreboard 里的 token
    }

    // 处理点击 Token 摧毁事件
    window.handleTokenClick = function(targetPid, comboIdx) {
        if(!state.targetingMode) return;
        
        const targetP = state.players[targetPid];
        const combo = targetP.combos[comboIdx];
        
        if(confirm(`确定要摧毁 ${targetP.name} 的 [${combo.name}] 吗？`)) {
            // 执行摧毁
            targetP.combos.splice(comboIdx, 1);
            // 牌回牌堆底 
            if(combo.cards) combo.cards.forEach(c => state.deck.unshift(c));
            
            log(`☄️ 你的陨石摧毁了 ${targetP.name} 的 [${combo.name}]！`);
            
            // 退出瞄准
            state.targetingMode = false;
            state.gamePhase = 'PLAY';
            document.getElementById('targeting-overlay').style.display = 'none';
            updateUI();
            nextTurn();
        }
    }

    function aiMeteorStrike(attackerId) {
        // AI 随机摧毁
        const targets = state.players.filter(p => p.id !== attackerId && p.combos.length > 0);
        if(targets.length > 0) {
            const target = targets[Math.floor(Math.random()*targets.length)];
            const deadCombo = target.combos.pop();
            if(deadCombo.cards) deadCombo.cards.forEach(c => state.deck.unshift(c));
            log(`☄️ 电脑使用了陨石，摧毁了 ${target.name} 的 [${deadCombo.name}]`);
        }
    }

    /* ================= 6. 结算与辅助 ================= */

    function passTurn() {
        state.players[0].passed = true;
        state.passedPlayers.add(0);
        state.players[0].hand.forEach(c=>c.selected=false);
        log("你跳过了回合。");
        nextTurn();
    }

    function nextTurn() {
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        checkTurn();
    }

    function endRoundLogic() {
        log(`=== 第 ${state.round} 回合结束 ===`);
        
        // 结算手牌分并回收
        let recycleBin = [...state.deck, ...state.discardPile];
        
        state.players.forEach(p => {
            // 手牌分
            const handScore = p.hand.reduce((s,c) => s+(c.score||0), 0);
            p.score += handScore;
            log(`${p.name} 手牌剩余 ${p.hand.length} 张，基础分 +${handScore}`);
            
            recycleBin = recycleBin.concat(p.hand);
            p.hand = [];

            // [关键] 回收组合牌实体，保留组合记录用于计分
            p.combos.forEach(c => {
                if(c.cards) recycleBin = recycleBin.concat(c.cards);
                c.cards = []; // 移除引用，防止重复回收
            });
        });

        state.deck = shuffle(recycleBin);
        state.discardPile = [];
        state.round++;
        setTimeout(startRound, 3000);
    }

    function endGame() {
        state.gamePhase = 'END';
        log("=== 游戏结束，最终计分 === [cite: 42]");
        
        let msg = "最终得分详情：\n";

        state.players.forEach(p => {
            let comboScore = p.combos.reduce((s,c) => s+(c.endScore||0), 0);
            
            // 计算终极目标 [cite: 40, 41]
            let ultimateBonus = 0;
            const ultCard = p.combos.find(c => c.type === 'Ultimate');
            if(ultCard) {
                // 简易检查逻辑
                const stars = p.combos.filter(c=>c.type==='Star').length;
                const meteors = p.combos.filter(c=>c.type==='Meteor').length;
                const attacks = p.combos.filter(c=>c.type==='Attack').length;
                const moons = p.combos.filter(c=>c.type==='Moon').length;
                
                if(ultCard.data.name === '宇宙网') {
                    if(stars>=2 && meteors>=2 && attacks>=2 && moons>=2) ultimateBonus = 40;
                } else if(ultCard.data.name === '河外丝状结构') {
                    if(stars>=4 && meteors>=2 && (attacks>=1 || moons>=1)) ultimateBonus = 30;
                }
                if(ultimateBonus > 0) log(`${p.name} 完成终极目标 [${ultCard.data.name}]! +${ultimateBonus}`);
            }

            // 计算基础目标 [cite: 44]
            let objBonus = 0;
            if(p.objective && p.objective.check(p.combos)) {
                objBonus = p.objective.bonus;
                log(`${p.name} 完成目标 [${p.objective.name}]! +${objBonus}`);
            }

            p.score += (comboScore + objBonus + ultimateBonus);
            msg += `${p.name}: ${p.score} (组合:${comboScore}, 目标:${objBonus+ultimateBonus})\n`;
        });

        state.players.sort((a,b)=>b.score - a.score);
        updateUI();
        alert(msg + `\n🏆 冠军是: ${state.players[0].name} !`);
    }

    function aiPlay(bot) {
        // AI 简化出牌
        const hand = bot.hand;
        // 尝试出流星
        const meteors = hand.filter(c=>c.type==='Meteor');
        if(meteors.length >= 3) return executePlay(bot.id, meteors.slice(0,3), validateCombo(meteors.slice(0,3)));
        // 尝试出星星
        const stars = hand.filter(c=>c.type==='Star');
        if(stars.length >= 3) return executePlay(bot.id, stars.slice(0,3), validateCombo(stars.slice(0,3)));
        // 尝试登月
        const astro = hand.find(c=>c.type==='Astronaut');
        const rocket = hand.find(c=>c.type==='Rocket');
        if(astro && rocket) return executePlay(bot.id, [astro,rocket], validateCombo([astro,rocket]));
        // 跳过
        bot.passed = true;
        state.passedPlayers.add(bot.id);
        log(`${bot.name} 跳过。`);
        checkTurn();
    }

    /* ================= 7. UI 渲染与交互 ================= */

    function updateUI() {
        document.getElementById('round-badge').innerText = `Round ${state.round} / 4`;
        document.getElementById('phase-badge').innerText = state.gamePhase;

        // 渲染手牌
        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        state.players[0].hand.forEach(c => {
            const el = createCardElement(c);
            el.onclick = () => {
                if(state.gamePhase !== 'PLAY') return;
                c.selected = !c.selected;
                updateUI(); // 仅刷新状态
            };
            handDiv.appendChild(el);
        });

        // 渲染计分板与陨石目标
        const scoreBody = document.getElementById('score-body');
        scoreBody.innerHTML = '';
        state.players.forEach(p => {
            let comboHtml = p.combos.map((c, idx) => {
                // 如果处于 Targeting 模式，且不是自己的组合，则可点击
                const isTarget = state.targetingMode && p.id !== 0; 
                return `<span class="combo-token ${isTarget?'targetable':''}" 
                        ${isTarget ? `onclick="handleTokenClick(${p.id}, ${idx})"` : ''}
                        title="${c.round?`第${c.round}回合`:''}">${c.name}</span>`;
            }).join('');
            
            scoreBody.innerHTML += `<tr>
                <td style="${state.currentPlayer===p.id?'color:#facc15':''}">${p.name}</td>
                <td style="font-weight:bold; color:#facc15">${p.score}</td>
                <td>${comboHtml || '-'}</td>
            </tr>`;
        });

        // 渲染对手
        const oppArea = document.getElementById('opponents-area');
        oppArea.innerHTML = '';
        for(let i=1; i<4; i++) {
            const p = state.players[i];
            oppArea.innerHTML += `<div class="opponent ${state.currentPlayer===i?'active':''}">
                <div>${p.name}</div>
                <div style="font-size:24px">🎴 x${p.hand.length}</div>
                <div style="font-size:12px;color:#94a3b8">${p.passed?'已跳过':''}</div>
            </div>`;
        }

        // 按钮状态
        const isMyTurn = state.currentPlayer === 0 && !state.players[0].passed && state.gamePhase === 'PLAY';
        document.getElementById('btn-play').disabled = !isMyTurn;
        document.getElementById('btn-pass').disabled = !isMyTurn;
    }

    function createCardElement(c) {
        const div = document.createElement('div');
        div.className = `card type-${c.type} ${c.selected?'selected':''}`;
        div.innerHTML = `<div>${c.name}</div><div class="card-desc">${c.desc||''}</div>`;
        return div;
    }

    function showModal(title, desc, choices, callback) {
        const m = document.getElementById('modal-window');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const body = document.getElementById('modal-body');
        body.innerHTML = '';
        choices.forEach((c, idx) => {
            const el = createCardElement(c);
            el.onclick = () => callback(idx);
            body.appendChild(el);
        });
        m.style.display = 'flex';
    }
    function hideModal() { document.getElementById('modal-window').style.display = 'none'; }
    function log(m) { const d=document.getElementById('game-log'); d.innerHTML+=`<div>> ${m}</div>`; d.scrollTop=d.scrollHeight; }

    // 启动
    initGame();

</script>
