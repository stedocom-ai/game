<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仰望星空 (Stargazing) - 最终视觉版</title>
    <style>
        /* --- 1. 全局与背景设置 --- */
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            user-select: none;
            color: #e2e8f0; 

            /* 背景图设置：黑色遮罩 + 您的山脉星空图 */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('bg.jpg');
            background-size: cover;
            background-position: center bottom; /* 让山脉沉在底部 */
            background-repeat: no-repeat;
        }
        
        #main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 60px 1fr 250px; /* 底部稍微加高给大卡牌 */
            height: 100vh;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        /* 玻璃拟态面板 */
        .panel { 
            background: rgba(15, 23, 42, 0.75); /* 深蓝半透明 */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        /* 顶部标题栏 */
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { margin: 0; font-size: 26px; color: #e2e8f0; font-weight: 300; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .status-group { display: flex; gap: 15px; }
        .status-badge { background: rgba(59, 130, 246, 0.8); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.2); }
        .badge-gold { background: rgba(234, 179, 8, 0.9); color: #422006; }

        /* 左侧边栏 */
        aside { grid-row: 2 / -1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        #scoreboard { flex: 1; overflow-y: auto; font-size: 13px; }
        #scoreboard table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        #scoreboard th { text-align: left; color: #94a3b8; padding: 5px; font-size: 12px; }
        #scoreboard td { padding: 8px; background: rgba(255,255,255,0.05); first-child: border-radius: 4px 0 0 4px; last-child: border-radius: 0 4px 4px 0; }
        
        /* 组合 Token */
        .combo-token { 
            display: inline-block; background: #334155; padding: 2px 8px; 
            border-radius: 10px; font-size: 11px; margin: 2px; 
            border: 1px solid #475569; cursor: default;
        }
        .token-Nebula { background: #701a75; border-color: #d8b4fe; color: #f5d0fe; }
        
        .combo-token.targetable {
            cursor: pointer; border-color: #ef4444; background: #7f1d1d; color: #fca5a5;
            animation: shake 0.5s infinite;
        }

        #game-log { height: 180px; background: rgba(0,0,0,0.6); color: #86efac; font-family: monospace; padding: 10px; border-radius: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; }

        /* 中央游戏区 */
        #game-center { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; padding-top: 20px; }
        #opponents-area { display: flex; justify-content: space-around; width: 100%; }
        .opponent { text-align: center; opacity: 0.8; transition: all 0.3s; position: relative; min-width: 120px; }
        .opponent.active { opacity: 1; transform: scale(1.1); text-shadow: 0 0 10px white; }
        .opponent-avatar { width: 60px; height: 60px; background: #334155; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #64748b; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        
        /* --- 2. 卡牌设计 (重点修改) --- */
        #player-area { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; position: relative; justify-content: flex-end; }
        .card-container { display: flex; gap: 10px; justify-content: center; padding: 10px; min-height: 180px; perspective: 1000px; z-index: 10; }
        
        .card {
            width: 120px; height: 180px; 
            border-radius: 12px;
            /* 移除背景色，改用溢出隐藏来切图 */
            background: #1e293b; 
            border: 2px solid #475569;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer; position: relative;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            overflow: hidden; /* 关键：裁切图片 */
            display: flex; flex-direction: column;
        }

        /* 上半部分：图片区 */
        .card-img-box {
            width: 100%; height: 65%; /* 图片占65%高度 */
            background: #0f172a; /* 图片加载前的底色 */
            position: relative;
        }
        .card-img-box img {
            width: 100%; height: 100%;
            object-fit: cover; /* 关键：填满不留白，自动裁切 */
            display: block;
        }

        /* 下半部分：文字区 */
        .card-info {
            width: 100%; height: 35%;
            background: rgba(30, 41, 59, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 5px; box-sizing: border-box;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .card-name { font-size: 13px; font-weight: bold; color: #f1f5f9; margin-bottom: 2px; }
        .card-desc { font-size: 10px; color: #94a3b8; text-align: center; line-height: 1.1; }

        /* 选中状态 */
        .card:hover { transform: translateY(-15px); border-color: #cbd5e1; z-index: 20; }
        .card.selected { 
            transform: translateY(-25px); 
            border-color: #facc15; 
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
        }

        /* --- 3. 按钮样式 (简约扁平) --- */
        .btn-group { margin-top: 15px; display: flex; gap: 20px; z-index: 20; }
        button { 
            padding: 10px 40px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; 
            background: #facc15; color: #0f172a; font-weight: bold; letter-spacing: 1px;
            transition: all 0.2s;
        }
        button:hover { background: #eab308; transform: scale(1.05); }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; }
        button.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        button.secondary:hover { background: rgba(255,255,255,0.2); }

        /* HUD */
        #objective-hud {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
            padding: 15px; border-radius: 12px; width: 220px;
            font-size: 12px; color: #cbd5e1;
            z-index: 50; pointer-events: none;
        }

        /* 模态框 */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 200; display: flex; 
            justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #475569; text-align: center; max-width: 800px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-title { font-size: 24px; color: #facc15; margin-bottom: 20px; }
        .modal-choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        /* 轮抽与瞄准 */
        #draft-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #targeting-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; display: flex; justify-content: center; padding-top: 100px; pointer-events: none; }
        #targeting-msg { background: #ef4444; color: white; padding: 10px 30px; font-weight: bold; border-radius: 30px; pointer-events: auto; animation: pulse 1s infinite; box-shadow: 0 0 20px #ef4444; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

<div id="modal-window" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 id="modal-title" class="modal-title">标题</h2>
        <p id="modal-desc" style="color:#cbd5e1; margin-bottom:30px;">描述文字</p>
        <div id="modal-body" class="modal-choices"></div>
    </div>
</div>

<div id="targeting-overlay" style="display:none;">
    <div id="targeting-msg">☄️ 陨石打击：请点击左侧计分板，选择一个对手的组合进行摧毁！</div>
</div>

<div id="main-layout">
    <header>
        <h1>仰望星空 <span style="font-size:12px; opacity:0.6; letter-spacing:1px">FINAL EDITION</span></h1>
        <div class="status-group">
            <div class="status-badge badge-gold">🏆 目标: 70分</div>
            <div class="status-badge" id="round-badge">Round 1 / 6</div>
            <div class="status-badge badge-red" id="phase-badge">...</div>
        </div>
    </header>

    <aside class="panel">
        <h3 style="color:#facc15; margin-top:0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">📊 战况统计</h3>
        <div id="scoreboard">
            <table>
                <thead><tr><th>玩家</th><th>分数</th><th>组合</th></tr></thead>
                <tbody id="score-body"></tbody>
            </table>
        </div>
        <div style="margin-top:10px; font-weight:bold; color:#94a3b8; font-size:12px">系统日志</div>
        <div id="game-log"></div>
    </aside>

    <div id="game-center">
        <div id="draft-overlay" style="display:none;">
            <div style="color:#facc15; font-size:28px; margin-bottom:10px; font-weight:bold; text-shadow:0 0 20px black;">🔄 轮抽阶段</div>
            <div style="color:#e2e8f0; margin-bottom:40px; background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:20px;">请选择一张牌保留，剩余的传给下家</div>
            <div id="draft-container" class="card-container"></div>
        </div>

        <div id="opponents-area"></div>
    </div>

    <div id="player-area" class="panel" style="background:transparent; border:none; box-shadow:none;">
        <div id="player-hand" class="card-container"></div>
        <div class="btn-group">
            <button onclick="attemptPlay()" id="btn-play" disabled>打出组合</button>
            <button onclick="passTurn()" class="secondary" id="btn-pass" disabled>跳过回合</button>
        </div>
        <div id="objective-hud">
            <div style="color:#94a3b8; margin-bottom:5px; font-weight:bold;">当前目标</div>
            <div id="objective-content">加载中...</div>
        </div>
    </div>
</div>

<script>
    /* ================= 数据定义 ================= */
    const CARD_DEFINITIONS = [
        { type: 'Star', name: '星星', count: 14, score: 1, desc: '3张=星座(+5)' },
        { type: 'Meteor', name: '流星', count: 9, score: 1, desc: '3张=许愿' },
        { type: 'Meteorite', name: '陨石', count: 6, score: 0, desc: '配星星=摧毁' },
        { type: 'Astronaut', name: '太空人', count: 6, score: 1, desc: '配火箭=登月(+4)' },
        { type: 'Rocket', name: '火箭', count: 6, score: 1, desc: '配太空人=登月(+4)' },
        { type: 'Nebula', name: '星云', count: 8, score: 1, desc: '2张=成长分' },
        { type: 'Event', name: '事件:星雨', count: 1, isEvent: true, effect: 'draw2', desc: '打出抽2张' },
        { type: 'Event', name: '事件:黑洞', count: 1, isEvent: true, effect: 'blackhole', desc: '全场重洗' },
        { type: 'Event', name: '事件:流星雨', count: 1, isEvent: true, effect: 'meteorShower', desc: '配流星+弃牌=许愿' },
        { type: 'Event', name: '事件:星辰闪耀', count: 1, isEvent: true, effect: 'scoreStars', desc: '星星组合+3分' },
        { type: 'Event', name: '事件:摘星揽月', count: 1, isEvent: true, effect: 'drawRocket', desc: '火箭组合抽1张' },
        { type: 'Event', name: '事件:小行星带', count: 1, isEvent: true, effect: 'drawStone', desc: '陨石组合抽1张' }
    ];

    const BASIC_OBJECTIVES = [
        { name: '仙女座星系', desc: '3组流星 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Meteor').length>=3 },
        { name: '蜂巢星系', desc: '4组星星 (+12分)', bonus: 12, check: (c)=>c.filter(x=>x.type==='Star').length>=4 },
        { name: '漩涡星系', desc: '2星星+2流星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Meteor').length>=2 },
        { name: '触须星系', desc: '2陨石+2火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Attack').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '车轮星系', desc: '2星星+2陨石 (+13分)', bonus: 13, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '喷流星系', desc: '4组火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Moon').length>=4 },
        { name: '猎户星云', desc: '2流星+2火箭 (+16分)', bonus: 16, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '草帽星系', desc: '2组流星+2组陨石 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '双子星系', desc: '2组星云+2组星星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Nebula').length>=2 && c.filter(x=>x.type==='Star').length>=2 }
    ];

    const ULTIMATE_OBJECTIVES = [
        { name: '河外丝状结构', desc: '4组星星, 2组流星, 1组陨石或火箭 (+30分)', bonus: 30, type: 'Ultimate' },
        { name: '宇宙网', desc: '2组星星, 2组流星, 2组陨石, 2组火箭 (+40分)', bonus: 40, type: 'Ultimate' }
    ];

    // 图片映射表
    const IMAGE_MAP = {
        'Star': 'star.jpg',
        'Meteor': 'meteor.jpg',
        'Nebula': 'nebula.jpg',
        'Meteorite': 'meteorite.jpg',
        'Astronaut': 'astronaut.jpg',
        'Rocket': 'rocket.jpg',
        'Event': 'event.jpg'
    };

    let state = {
        round: 1,
        maxRounds: 6,
        targetScore: 70, 
        players: [],
        deck: [],
        discardPile: [],
        ultimateDeck: [], 
        draftPacks: [],
        currentPlayer: 0,
        passedPlayers: new Set(),
        gamePhase: 'INIT', 
        targetingMode: false
    };

    function initGame() {
        log(">>> 游戏初始化...");
        state.deck = createDeck();
        state.ultimateDeck = shuffle([...ULTIMATE_OBJECTIVES]); 
        
        state.players = [
            { id: 0, name: "你", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 1, name: "电脑 A", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 2, name: "电脑 B", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 3, name: "电脑 C", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] }
        ];

        assignObjectives();
    }

    function createDeck() {
        let newDeck = [];
        CARD_DEFINITIONS.forEach(def => {
            for(let i=0; i<def.count; i++) newDeck.push({ ...def, uid: Math.random().toString(36).substr(2, 9) });
        });
        return shuffle(newDeck);
    }

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function assignObjectives() {
        let objDeck = shuffle([...BASIC_OBJECTIVES]);
        for(let i=1; i<4; i++) { state.players[i].objective = objDeck.pop(); objDeck.pop(); }
        const choice1 = objDeck.pop();
        const choice2 = objDeck.pop();

        showModal("选择你的目标", "请从以下两张目标卡中选择一张保留。", 
            [choice1, choice2].map(c => ({...c, type:'Objective'})),
            (selectedIndex) => {
                const selected = [choice1, choice2][selectedIndex];
                state.players[0].objective = selected;
                updateHUD();
                log(`你选择了目标：${selected.name}`);
                hideModal();
                startRound();
            }
        );
    }

    function calculateFinalScore(p) {
        let breakdown = { current: p.score, combo: 0, nebula: 0, objective: 0, total: 0 };
        breakdown.combo = p.combos.filter(c => c.type !== 'Nebula').reduce((s,c) => s+(c.endScore||0), 0);
        const nebulaCount = p.combos.filter(c => c.type === 'Nebula').length;
        breakdown.nebula = nebulaCount * (nebulaCount + 2); 
        if(p.objective && p.objective.check(p.combos)) breakdown.objective += p.objective.bonus;
        p.combos.filter(c => c.type === 'Ultimate').forEach(u => {
             const stars = p.combos.filter(c=>c.type==='Star').length;
             const meteors = p.combos.filter(c=>c.type==='Meteor').length;
             const attacks = p.combos.filter(c=>c.type==='Attack').length;
             const moons = p.combos.filter(c=>c.type==='Moon').length;
             if(u.data.name === '宇宙网') { if(stars>=2 && meteors>=2 && attacks>=2 && moons>=2) breakdown.objective += 40; } 
             else if(u.data.name === '河外丝状结构') { if(stars>=4 && meteors>=2 && (attacks>=1 || moons>=1)) breakdown.objective += 30; }
        });
        breakdown.total = breakdown.current + breakdown.combo + breakdown.nebula + breakdown.objective;
        return breakdown;
    }

    function startRound() {
        if(state.round > state.maxRounds) { endGame(); return; }
        state.gamePhase = 'DRAFT';
        state.passedPlayers.clear();
        state.players.forEach(p => { p.passed = false; p.hand = []; }); 
        updateUI();
        log(`=== 第 ${state.round} 回合：轮抽阶段 ===`);
        state.draftPacks = [[], [], [], []];
        for(let i=0; i<4; i++) { for(let j=0; j<7; j++) { if(state.deck.length > 0) state.draftPacks[i].push(state.deck.pop()); } }
        runDraftUI();
    }

    function runDraftUI() {
        if(state.players[0].hand.length >= 7) {
            log("轮抽结束，进入出牌阶段！");
            document.getElementById('draft-overlay').style.display = 'none';
            state.gamePhase = 'PLAY';
            state.currentPlayer = 0;
            updateUI();
            checkTurn();
            return;
        }
        document.getElementById('draft-overlay').style.display = 'flex';
        const container = document.getElementById('draft-container');
        container.innerHTML = '';
        state.draftPacks[0].forEach((card, idx) => {
            const el = createCardElement(card);
            el.onclick = () => {
                state.players[0].hand.push(state.draftPacks[0].splice(idx, 1)[0]);
                aiDraft();
                const last = state.draftPacks.pop();
                state.draftPacks.unshift(last);
                runDraftUI();
            };
            container.appendChild(el);
        });
    }

    function aiDraft() {
        for(let i=1; i<4; i++) {
            const pack = state.draftPacks[i];
            if(pack.length > 0) {
                let pick = pack.findIndex(c => c.type === 'Nebula');
                if(pick === -1) pick = pack.findIndex(c => c.type === 'Star');
                if(pick === -1) pick = 0;
                state.players[i].hand.push(pack.splice(pick, 1)[0]);
            }
        }
    }

    function checkTurn() {
        updateUI();
        if(state.passedPlayers.size === 4) { endRoundLogic(); return; }
        const curr = state.players[state.currentPlayer];
        if(curr.passed) { nextTurn(); return; }
        if(!curr.isHuman) {
            document.querySelectorAll('.opponent')[curr.id-1].classList.add('active');
            setTimeout(() => aiPlay(curr), 800);
        } else {
            document.querySelectorAll('.opponent').forEach(e=>e.classList.remove('active'));
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-pass').disabled = false;
            log("👉 轮到你了！");
        }
    }

    function attemptPlay() {
        const hand = state.players[0].hand;
        const selected = hand.filter(c => c.selected);
        if(selected.length === 0) return alert("请先选牌！");
        const res = validateCombo(selected);
        if(res.valid) {
            if(res.reqDiscard) {
                if(selected.length !== 3) return alert("【流星雨】需选择3张牌：流星雨+流星+弃牌");
                if(!selected.some(c=>c.name.includes('流星雨')) || !selected.some(c=>c.type==='Meteor')) return alert("组合错误");
            }
            executePlay(0, selected, res);
        } else { alert("❌ 无效组合: " + res.reason); }
    }

    function validateCombo(cards) {
        const types = cards.map(c => c.type);
        const len = cards.length;
        if(len === 1 && cards[0].isEvent) {
            if(cards[0].effect === 'meteorShower') return {valid:false, reason:"流星雨事件卡不能单独打出"};
            return {valid:true, type:'Event', data:cards[0]};
        }
        if(len===3 && types.every(t=>t==='Star')) return {valid:true, type:'Star', name:'星座组合', endScore:5};
        if(len===3 && types.every(t=>t==='Meteor')) return {valid:true, type:'Meteor', name:'流星许愿', endScore:3};
        if(len===2 && types.every(t=>t==='Nebula')) return {valid:true, type:'Nebula', name:'星云(成长)', endScore:0}; 
        if(cards.some(c=>c.effect==='meteorShower') && len===3 && types.includes('Meteor') && types.includes('Event')) return {valid:true, type:'Meteor', name:'流星雨(事件)', endScore:3, reqDiscard:true};
        if(len===2 && types.includes('Astronaut') && types.includes('Rocket')) return {valid:true, type:'Moon', name:'登月成功', endScore:4};
        if(len===2 && types.includes('Meteorite') && types.includes('Star')) return {valid:true, type:'Attack', name:'陨石打击', endScore:0};
        return {valid:false, reason:"不符合规则"};
    }

    function executePlay(pid, cards, combo) {
        const p = state.players[pid];
        p.hand = p.hand.filter(h => !cards.some(c => c.uid === h.uid));
        let displayCards = [...cards];
        if(combo.reqDiscard) {
            const discard = cards.find(c => c.type !== 'Meteor' && c.effect !== 'meteorShower');
            if(discard) { state.discardPile.push(discard); displayCards = cards.filter(c => c !== discard); }
        }
        if(combo.type === 'Event') {
            state.discardPile.push(cards[0]);
            log(`${p.name} 发动事件：${combo.data.name}`);
            applyEventEffect(pid, combo.data.effect);
        } else {
            p.combos.push({ name: combo.name, type: combo.type, endScore: combo.endScore, cards: displayCards, round: state.round });
            p.score += (combo.score || 0);
            log(`${p.name} 打出 [${combo.name}]`);
            if(combo.type === 'Attack') { 
                p.score += 1; 
                if(pid===0) { enterTargetingMode(); return; } 
                else aiMeteorStrike(pid);
            }
            if(combo.type === 'Moon') drawCards(pid, 1);
            if(combo.type === 'Meteor') handleWish(pid);
        }
        updateUI();
        if(state.gamePhase !== 'TARGETING') nextTurn();
    }

    function applyEventEffect(pid, effect) {
        const p = state.players[pid];
        if(effect === 'draw2') drawCards(pid, 2);
        if(effect === 'blackhole') { state.players.forEach(pl => { if(pl.id !== pid && pl.hand.length > 0) state.deck.push(pl.hand.pop()); }); shuffle(state.deck); log("黑洞触发：全场重洗"); }
        if(effect === 'drawRocket') { const count = p.combos.filter(c => c.type === 'Moon' && c.round === state.round).length; if(count>0) { drawCards(pid, count); log(`摘星揽月：抽 ${count} 张`); } }
        if(effect === 'drawStone') { const count = p.combos.filter(c => c.type === 'Attack' && c.round === state.round).length; if(count>0) { drawCards(pid, count); log(`小行星带：抽 ${count} 张`); } }
        if(effect === 'scoreStars') { const count = p.combos.filter(c => c.type === 'Star' && c.round === state.round).length; p.score += count * 3; log(`星辰闪耀：+${count*3} 分`); }
    }

    function handleWish(pid) {
        if(pid === 0) {
            showModal("🌠 流星许愿", "请选择你的愿望", 
                [{name:'贪婪', desc:'抽取 2 张牌', icon:'🃏'}, {name:'声望', desc:'立即 +3 分', icon:'🏆'}, {name:'野心', desc:'抽取 1 张终极目标卡', icon:'📜'}].map(x=>({...x, type:'Event'})),
                (idx) => {
                    hideModal();
                    if(idx===0) { drawCards(0, 2); log("许愿：抽了2张牌"); }
                    if(idx===1) { state.players[0].score += 3; log("许愿：获得3分"); }
                    if(idx===2) {
                        if(state.ultimateDeck.length > 0) {
                            const ult = state.ultimateDeck.pop();
                            state.players[0].ultimateObjs.push(ult);
                            state.players[0].combos.push({name:'终极目标', type:'Ultimate', data:ult, endScore:0});
                            alert(`获得：${ult.name}`);
                            updateHUD(); 
                        } else { alert("卡没了，抽牌补偿"); drawCards(0, 2); }
                    }
                    updateUI();
                }
            );
        } else { if(state.players[pid].hand.length < 3) drawCards(pid, 2); else state.players[pid].score += 3; }
    }

    function drawCards(pid, num) { for(let i=0; i<num; i++) if(state.deck.length>0) state.players[pid].hand.push(state.deck.pop()); }
    
    function enterTargetingMode() { state.gamePhase = 'TARGETING'; state.targetingMode = true; document.getElementById('targeting-overlay').style.display = 'flex'; updateUI(); }
    window.handleTokenClick = function(targetPid, comboIdx) {
        if(!state.targetingMode) return;
        const targetP = state.players[targetPid];
        const combo = targetP.combos[comboIdx];
        if(confirm(`摧毁 ${targetP.name} 的 [${combo.name}] ?`)) {
            targetP.combos.splice(comboIdx, 1);
            if(combo.cards) combo.cards.forEach(c => state.deck.unshift(c));
            log(`☄️ 摧毁了 ${targetP.name} 的组合`);
            state.targetingMode = false;
            state.gamePhase = 'PLAY';
            document.getElementById('targeting-overlay').style.display = 'none';
            updateUI();
            nextTurn();
        }
    }

    function aiMeteorStrike(attackerId) {
        const targets = state.players.filter(p => p.id !== attackerId && p.combos.length > 0);
        if(targets.length > 0) {
            const t = targets[Math.floor(Math.random()*targets.length)];
            const dead = t.combos.pop();
            if(dead.cards) dead.cards.forEach(c => state.deck.unshift(c));
            log(`☄️ 电脑摧毁了 ${t.name} 的组合`);
        }
    }

    function aiPlay(bot) {
        const hand = bot.hand;
        const nebulas = hand.filter(c=>c.type==='Nebula');
        if(nebulas.length >= 2) return executePlay(bot.id, nebulas.slice(0,2), validateCombo(nebulas.slice(0,2)));
        const meteors = hand.filter(c=>c.type==='Meteor');
        if(meteors.length >= 3) return executePlay(bot.id, meteors.slice(0,3), validateCombo(meteors.slice(0,3)));
        const stars = hand.filter(c=>c.type==='Star');
        if(stars.length >= 3) return executePlay(bot.id, stars.slice(0,3), validateCombo(stars.slice(0,3)));
        const astro = hand.find(c=>c.type==='Astronaut');
        const rocket = hand.find(c=>c.type==='Rocket');
        if(astro && rocket) return executePlay(bot.id, [astro,rocket], validateCombo([astro,rocket]));
        bot.passed = true;
        state.passedPlayers.add(bot.id);
        log(`${bot.name} 跳过。`);
        checkTurn();
    }

    function passTurn() { state.players[0].passed = true; state.passedPlayers.add(0); state.players[0].hand.forEach(c=>c.selected=false); log("跳过回合。"); nextTurn(); }
    function nextTurn() { state.currentPlayer = (state.currentPlayer + 1) % 4; checkTurn(); }

    function endRoundLogic() {
        log(`=== 第 ${state.round} 回合结束 ===`);
        let recycleBin = [...state.deck, ...state.discardPile];
        state.players.forEach(p => {
            const handScore = p.hand.reduce((s,c) => s+(c.score||0), 0);
            p.score += handScore;
            recycleBin = recycleBin.concat(p.hand);
            p.hand = [];
            p.combos.forEach(c => { if(c.cards) recycleBin = recycleBin.concat(c.cards); c.cards = []; });
        });
        state.deck = shuffle(recycleBin);
        state.discardPile = [];
        const potentialWinner = state.players.find(p => calculateFinalScore(p).total >= state.targetScore);
        if(potentialWinner || state.round >= state.maxRounds) {
            setTimeout(endGame, 1000);
        } else {
            state.round++;
            setTimeout(startRound, 2000);
        }
    }

    function endGame() {
        state.gamePhase = 'END';
        log("=== 最终计分 ===");
        let msg = "🏆 最终得分详情：\n\n";
        state.players.forEach(p => {
            const finalStats = calculateFinalScore(p);
            p.score = finalStats.total;
            msg += `${p.name}: 总分 ${finalStats.total}\n   ├─ 基础: ${finalStats.current} | 组合: ${finalStats.combo}\n   └─ 星云: ${finalStats.nebula} | 目标: ${finalStats.objective}\n\n`;
        });
        state.players.sort((a,b)=>b.score - a.score);
        updateUI();
        alert(msg + `\n👑 冠军: ${state.players[0].name}`);
    }

    function updateHUD() {
        const hud = document.getElementById('objective-content');
        let html = '';
        if(state.players[0].objective) html += `<div class="hud-item"><strong style="color:#facc15">${state.players[0].objective.name}</strong><br>${state.players[0].objective.desc}</div>`;
        state.players[0].ultimateObjs.forEach(u => { html += `<div class="hud-item"><strong style="color:#f472b6">${u.name}</strong><br>${u.desc}</div>`; });
        hud.innerHTML = html || '无';
    }

    function updateUI() {
        document.getElementById('round-badge').innerText = `Round ${state.round} / ${state.maxRounds}`;
        document.getElementById('phase-badge').innerText = state.gamePhase;
        
        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        state.players[0].hand.forEach(c => { handDiv.appendChild(createCardElement(c)); });

        const scoreBody = document.getElementById('score-body');
        scoreBody.innerHTML = '';
        state.players.forEach(p => {
            let comboHtml = p.combos.map((c, idx) => {
                const isTarget = state.targetingMode && p.id !== 0; 
                let tokenClass = c.type === 'Nebula' ? 'token-Nebula' : (c.type === 'Ultimate' ? 'token-Ultimate' : '');
                return `<span class="combo-token ${tokenClass} ${isTarget?'targetable':''}" ${isTarget ? `onclick="handleTokenClick(${p.id}, ${idx})"` : ''}>${c.name}</span>`;
            }).join('');
            scoreBody.innerHTML += `<tr><td style="${state.currentPlayer===p.id?'color:#facc15':''}">${p.name}</td><td style="font-weight:bold; color:#facc15">${p.score}</td><td>${comboHtml || '-'}</td></tr>`;
        });

        const oppArea = document.getElementById('opponents-area');
        oppArea.innerHTML = '';
        for(let i=1; i<4; i++) {
            const p = state.players[i];
            oppArea.innerHTML += `<div class="opponent ${state.currentPlayer===i?'active':''}"><div class="opponent-avatar">🤖</div><div>${p.name}</div><div style="font-size:20px">🎴 x${p.hand.length}</div></div>`;
        }

        const isMyTurn = state.currentPlayer === 0 && !state.players[0].passed && state.gamePhase === 'PLAY';
        document.getElementById('btn-play').disabled = !isMyTurn;
        document.getElementById('btn-pass').disabled = !isMyTurn;
    }

    function createCardElement(c) {
        const div = document.createElement('div');
        div.className = `card ${c.selected?'selected':''}`;
        elFn = () => { if(state.gamePhase==='PLAY'||state.gamePhase==='DRAFT'||state.gamePhase==='INIT') { if(state.gamePhase==='PLAY') c.selected = !c.selected; updateUI(); } };
        // 使用映射表查找图片
        const imgSrc = IMAGE_MAP[c.type] || 'event.jpg';
        
        // 特殊处理目标卡（没有图片，只有文字）
        if(c.type === 'Objective' || c.type === 'Ultimate') {
            div.innerHTML = `<div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px; background:#0f172a;"><div style="font-size:30px; margin-bottom:10px;">📜</div><div style="font-weight:bold; color:#facc15; font-size:12px;">${c.name}</div><div style="font-size:10px; color:#cbd5e1; margin-top:5px;">${c.desc}</div></div>`;
        } else {
            // 普通卡：上图下文
            div.innerHTML = `
                <div class="card-img-box"><img src="${imgSrc}"></div>
                <div class="card-info">
                    <div class="card-name">${c.name}</div>
                    <div class="card-desc">${c.desc||''}</div>
                </div>`;
        }
        div.onclick = elFn;
        return div;
    }

    function showModal(title, desc, choices, callback) {
        const m = document.getElementById('modal-window');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const body = document.getElementById('modal-body');
        body.innerHTML = '';
        choices.forEach((c, idx) => {
            const el = createCardElement(c);
            el.onclick = () => callback(idx);
            body.appendChild(el);
        });
        m.style.display = 'flex';
    }
    function hideModal() { document.getElementById('modal-window').style.display = 'none'; }
    function log(m) { const d=document.getElementById('game-log'); d.innerHTML+=`<div>> ${m}</div>`; d.scrollTop=d.scrollHeight; }

    initGame();
</script>
