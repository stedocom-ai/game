<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仰望星空 (v4.4 Gravity Capture)</title>
    <style>
        /* --- 1. 全局设置 --- */
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            user-select: none; color: #e2e8f0; 
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('bg.jpg');
            background-size: cover; background-position: center bottom; background-repeat: no-repeat;
            background-color: #0f172a; 
        }
        
        #main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 60px 1fr 260px;
            height: 100vh; gap: 15px; padding: 15px; box-sizing: border-box;
            transition: filter 0.3s;
        }

        body.targeting-active #main-layout { filter: brightness(0.6) grayscale(0.3); }
        body.targeting-active aside.panel {
            filter: brightness(1.5) grayscale(0);
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            z-index: 600; position: relative;
        }
        /* 夺取模式下的特殊高亮 */
        body.targeting-active.mode-steal aside.panel {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5); /* 紫色光晕 */
        }

        .panel { 
            background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; padding: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; 
        }

        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { margin: 0; font-size: 26px; color: #e2e8f0; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .status-group { display: flex; gap: 15px; }
        .status-badge { background: rgba(59, 130, 246, 0.8); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.2); }
        .badge-gold { background: rgba(234, 179, 8, 0.9); color: #422006; }

        aside { grid-row: 2 / -1; gap: 15px; overflow: hidden; }
        #scoreboard-container { flex: 1; overflow-y: auto; min-height: 150px; }
        #scoreboard table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        #scoreboard th { text-align: left; color: #94a3b8; padding: 5px; font-size: 12px; }
        #scoreboard td { padding: 8px; background: rgba(255,255,255,0.05); }
        
        .combo-token { display: inline-block; background: #334155; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; border: 1px solid #475569; cursor: default; transition: all 0.2s; }
        .token-Star { border-color: #facc15; color: #fef08a; }
        .token-Meteor { border-color: #38bdf8; color: #bae6fd; }
        .token-Nebula { border-color: #d8b4fe; color: #f5d0fe; background: rgba(192, 132, 252, 0.2); }
        .token-Ultimate { background: #be185d; border-color: #f472b6; color: #fff; border-width: 2px; font-weight: bold; }
        
        body.targeting-active .combo-token { opacity: 0.3; }
        body.targeting-active .combo-token.targetable { opacity: 1; cursor: crosshair; border-color: #f97316; background: #7c2d12; color: #fdba74; box-shadow: 0 0 10px #f97316; animation: breathe 1.5s infinite alternate; }
        
        /* 夺取模式下的 Token 样式 */
        body.targeting-active.mode-steal .combo-token.targetable {
            border-color: #d8b4fe; background: #581c87; color: #e9d5ff; 
            box-shadow: 0 0 15px #a855f7;
        }
        body.targeting-active .combo-token.targetable:hover { transform: scale(1.2); filter: brightness(1.3); }

        #game-log { height: 150px; background: rgba(0,0,0,0.6); color: #86efac; font-family: monospace; padding: 10px; border-radius: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; margin-bottom: 15px; }

        #objective-hud {
            background: rgba(6, 78, 59, 0.6); border: 1px solid #10b981;
            padding: 10px; border-radius: 8px; 
            font-size: 12px; color: #d1fae5; flex-shrink: 0;
        }
        .hud-title { font-weight: bold; color: #10b981; margin-bottom: 5px; border-bottom: 1px solid rgba(16, 185, 129, 0.3); padding-bottom: 3px; }

        #game-center { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; padding-top: 20px; }
        #opponents-area { display: flex; justify-content: space-around; width: 100%; }
        .opponent { text-align: center; opacity: 0.8; transition: all 0.3s; position: relative; min-width: 120px; }
        .opponent.active { opacity: 1; transform: scale(1.1); text-shadow: 0 0 10px white; }
        .opponent-avatar { width: 60px; height: 60px; background: #334155; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #64748b; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        
        #draft-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(5px); }
        #draft-container .card { transform: scale(1.1); margin: 0 10px; }
        #draft-container .card:hover { transform: scale(1.2) translateY(-10px); border-color: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.5); }

        #player-area { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; position: relative; justify-content: flex-end; }
        .card-container { display: flex; gap: 10px; justify-content: center; padding: 10px; min-height: 180px; perspective: 1000px; z-index: 10; }
        
        .card {
            width: 120px; height: 180px; border-radius: 12px;
            background: #1e293b; border: 2px solid #475569;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer; position: relative;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .card-img-box { width: 100%; height: 65%; background: #0f172a; position: relative; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { width: 100%; height: 35%; background: rgba(30, 41, 59, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; border-top: 1px solid rgba(255,255,255,0.1); }
        .card-name { font-size: 13px; font-weight: bold; color: #f1f5f9; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; }
        .card-desc { font-size: 10px; color: #94a3b8; text-align: center; line-height: 1.1; }

        .card:hover { transform: translateY(-15px); border-color: #cbd5e1; z-index: 20; }
        .card.selected { transform: translateY(-25px); border-color: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.6); }
        .hand-dimmed .card { opacity: 0.5; filter: grayscale(0.5); cursor: not-allowed; }

        .btn-group { margin-top: 15px; display: flex; gap: 20px; z-index: 20; }
        button { padding: 10px 40px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; background: #facc15; color: #0f172a; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #eab308; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        button.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 900; display: flex; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #475569; text-align: center; min-width: 600px; max-width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-title { font-size: 28px; color: #facc15; margin-bottom: 20px; }
        .modal-choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; flex-direction: row; }
        
        #game-over-screen { display:none; position: fixed; top:0; left:0; width:100%; height:100%; z-index:300; flex-direction:column; justify-content:center; align-items:center; color:white; background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.95)), url('image_9.png'); background-size: cover; background-position: center; }
        #game-over-content { text-align: center; animation: fadeIn 1s; }
        .restart-btn { font-size: 20px; padding: 15px 50px; background: linear-gradient(to right, #facc15, #eab308); color: #422006; border-radius: 50px; border: none; cursor: pointer; box-shadow: 0 0 30px rgba(250, 204, 21, 0.4); margin-top: 30px; font-weight: bold; }

        #targeting-hud { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 700; display: none; background: rgba(124, 45, 18, 0.9); border: 1px solid #f97316; padding: 10px 40px; border-radius: 50px; color: #ffedd5; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); pointer-events: none; }
        /* 夺取模式下的 HUD 颜色 */
        .hud-steal { background: rgba(88, 28, 135, 0.9) !important; border-color: #a855f7 !important; color: #f3e8ff !important; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4) !important; }

        @keyframes breathe { 0% { box-shadow: 0 0 5px #f97316; } 100% { box-shadow: 0 0 20px #f97316, 0 0 40px rgba(249, 115, 22, 0.5); } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<div id="targeting-hud">⌖ 瞄准系统启动</div>

<div id="modal-window" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 id="modal-title" style="color:#facc15; font-size:28px; margin-bottom:20px;">标题</h2>
        <p id="modal-desc" style="color:#cbd5e1; margin-bottom:30px; font-size:16px;">描述文字</p>
        <div id="modal-body" class="modal-choices"></div>
    </div>
</div>

<div id="game-over-screen">
    <div id="game-over-content">
        <h1 style="font-size: 60px; color: #facc15; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,0,0,0.5);">🌟 游戏结束 🌟</h1>
        <div id="winner-name" style="font-size: 30px; color: #fff; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,0,0,0.5);">冠军: ???</div>
        <div id="final-scores" style="text-align: left; background: rgba(15, 23, 42, 0.8); padding: 30px; border-radius: 16px; margin-bottom: 30px; min-width: 400px; max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="restart-btn" onclick="resetGame()">✨ 开启新的旅程</button>
    </div>
</div>

<div id="main-layout">
    <header>
        <h1>仰望星空 <span style="font-size:12px; opacity:0.6; letter-spacing:1px">v4.4 GRAVITY</span></h1>
        <div class="status-group">
            <div class="status-badge badge-gold">🏆 目标: 70分</div>
            <div class="status-badge" id="round-badge">Round 1 / 6</div>
            <div class="status-badge badge-red" id="phase-badge">...</div>
        </div>
    </header>

    <aside class="panel">
        <h3 style="color:#facc15; margin-top:0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">📊 战况统计</h3>
        <div id="scoreboard-container">
            <div id="scoreboard">
                <table>
                    <thead><tr><th>玩家</th><th>分数</th><th>组合</th></tr></thead>
                    <tbody id="score-body"></tbody>
                </table>
            </div>
        </div>
        
        <div style="margin-top:10px; font-weight:bold; color:#94a3b8; font-size:12px">系统日志</div>
        <div id="game-log"></div>

        <div id="objective-hud">
            <div class="hud-title">📜 当前目标</div>
            <div id="objective-content">加载中...</div>
        </div>
    </aside>

    <div id="game-center">
        <div id="draft-overlay" style="display:none;">
            <div style="color:#facc15; font-size:32px; margin-bottom:10px; font-weight:bold; text-shadow:0 0 20px black;">🔄 轮抽阶段</div>
            <div style="color:#e2e8f0; margin-bottom:40px; font-size:18px;">请选择一张牌保留，剩余的传给下家</div>
            <div id="draft-container" class="card-container"></div>
        </div>

        <div id="opponents-area"></div>
    </div>

    <div id="player-area" class="panel" style="background:transparent; border:none; box-shadow:none;">
        <div id="player-hand" class="card-container"></div>
        <div class="btn-group">
            <button onclick="attemptPlay()" id="btn-play" disabled>打出组合</button>
            <button onclick="passTurn()" class="secondary" id="btn-pass" disabled>跳过回合</button>
        </div>
    </div>
</div>

<script>
    /* ================= 数据定义 (v4.4) ================= */
    const CARD_DEFINITIONS = [
        { type: 'Star', name: '星星', count: 14, score: 1, desc: '3张=星座(+6)', img: 'star.jpg' }, 
        { type: 'Meteor', name: '流星', count: 9, score: 1, desc: '3张=许愿', img: 'meteor.jpg' },
        { type: 'Meteorite', name: '陨石', count: 3, score: 0, desc: '配星星=摧毁', img: 'meteorite.jpg' }, 
        { type: 'Astronaut', name: '太空人', count: 6, score: 1, desc: '配火箭=登月(+4)', img: 'astronaut.jpg' },
        { type: 'Rocket', name: '火箭', count: 6, score: 1, desc: '配太空人=登月(+4)', img: 'rocket.jpg' },
        { type: 'Nebula', name: '星云', count: 8, score: 1, desc: '2张=成长分', img: 'nebula.jpg' },
        
        { type: 'Event', name: '事件:星雨', count: 1, isEvent: true, effect: 'draw2', desc: '打出抽2张', img: 'image_2.png' },     
        { type: 'Event', name: '事件:黑洞', count: 1, isEvent: true, effect: 'blackhole', desc: '全场重洗', img: 'image_7.png' },   
        { type: 'Event', name: '事件:流星雨', count: 1, isEvent: true, effect: 'meteorShower', desc: '配流星+弃牌=许愿', img: 'image_3.png' }, 
        { type: 'Event', name: '事件:星辰闪耀', count: 1, isEvent: true, effect: 'starPower', desc: '配1星星=特殊效果', img: 'image_6.png' },  
        { type: 'Event', name: '事件:摘星揽月', count: 1, isEvent: true, effect: 'drawRocket', desc: '火箭组合抽1张', img: 'image_5.png' }, 
        
        // [修改] 小行星带现在执行 'gravityCapture' 逻辑 (描述只是提示)
        { type: 'Event', name: '事件:小行星带', count: 1, isEvent: true, effect: 'mining', desc: '配1陨石2星星=夺取', img: 'image_4.png' } 
    ];

    const BASIC_OBJECTIVES = [
        { name: '仙女座星系', desc: '3组流星 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Meteor').length>=3 },
        { name: '蜂巢星系', desc: '3组星星 (+18分)', bonus: 18, check: (c)=>c.filter(x=>x.type==='Star').length>=3 },
        { name: '漩涡星系', desc: '2星星+2流星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Meteor').length>=2 },
        { name: '触须星系', desc: '2陨石+2火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Attack').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '车轮星系', desc: '1组星星+2组陨石打击 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Star').length>=1 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '喷流星系', desc: '4组火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Moon').length>=4 },
        { name: '猎户星云', desc: '2流星+2火箭 (+16分)', bonus: 16, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '草帽星系', desc: '2组流星+2组陨石 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '双子星系', desc: '2组星云+2组星星 (+16分)', bonus: 16, check: (c)=>c.filter(x=>x.type==='Nebula').length>=2 && c.filter(x=>x.type==='Star').length>=2 }
    ];

    const ULTIMATE_OBJECTIVES = [
        { name: '河外丝状结构', desc: '3组星星, 2组流星, 1组陨石或火箭 (+35分)', bonus: 35, type: 'Ultimate' },
        { name: '宇宙网', desc: '2组星星, 2组流星, 2组陨石, 2组火箭 (+40分)', bonus: 40, type: 'Ultimate' }
    ];

    const IMAGE_MAP = { 'Star': 'star.jpg', 'Meteor': 'meteor.jpg', 'Nebula': 'nebula.jpg', 'Meteorite': 'meteorite.jpg', 'Astronaut': 'astronaut.jpg', 'Rocket': 'rocket.jpg' };

    let state = {
        round: 1, maxRounds: 6, targetScore: 70, 
        players: [], deck: [], discardPile: [], ultimateDeck: [], 
        draftPacks: [], currentPlayer: 0, passedPlayers: new Set(),
        gamePhase: 'INIT', targetingMode: false, 
        targetingAction: null // [新增] 用于区分 DESTROY 和 STEAL
    };

    function initGame() {
        log(">>> 游戏初始化 (v4.4 Gravity)...");
        state.deck = createDeck();
        state.ultimateDeck = shuffle([...ULTIMATE_OBJECTIVES]); 
        state.round = 1;
        state.discardPile = [];
        state.passedPlayers = new Set();
        state.targetingMode = false;
        
        state.players = [
            { id: 0, name: "你", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 1, name: "电脑 A", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 2, name: "电脑 B", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 3, name: "电脑 C", isHuman: false, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] }
        ];

        document.getElementById('game-over-screen').style.display = 'none';
        assignObjectives();
    }

    function resetGame() { initGame(); }
    function createDeck() {
        let newDeck = [];
        CARD_DEFINITIONS.forEach(def => {
            for(let i=0; i<def.count; i++) newDeck.push({ ...def, uid: Math.random().toString(36).substr(2, 9), selected: false });
        });
        return shuffle(newDeck);
    }
    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function assignObjectives() {
        let objDeck = shuffle([...BASIC_OBJECTIVES]);
        for(let i=1; i<4; i++) { state.players[i].objective = objDeck.pop(); objDeck.pop(); }
        const choice1 = objDeck.pop();
        const choice2 = objDeck.pop();

        setTimeout(() => {
            showModal("选择你的目标", "请从以下两张目标卡中选择一张保留。", 
                [choice1, choice2].map(c => ({...c, type:'Objective'})),
                (selectedIndex) => {
                    const selected = [choice1, choice2][selectedIndex];
                    state.players[0].objective = selected;
                    updateHUD();
                    log(`你选择了目标：${selected.name}`);
                    hideModal();
                    startRound();
                }
            );
        }, 500);
    }

    function calculateFinalScore(p) {
        let breakdown = { current: p.score, combo: 0, nebula: 0, objective: 0, total: 0 };
        breakdown.combo = p.combos.filter(c => c.type !== 'Nebula').reduce((s,c) => s+(c.endScore||0), 0);
        const nebulaCount = p.combos.filter(c => c.type === 'Nebula').length;
        breakdown.nebula = nebulaCount * (nebulaCount + 2); 
        if(p.objective && p.objective.check(p.combos)) breakdown.objective += p.objective.bonus;
        p.combos.filter(c => c.type === 'Ultimate').forEach(u => {
             const stars = p.combos.filter(c=>c.type==='Star').length;
             const meteors = p.combos.filter(c=>c.type==='Meteor').length;
             const attacks = p.combos.filter(c=>c.type==='Attack').length;
             const moons = p.combos.filter(c=>c.type==='Moon').length;
             if(u.data.name === '宇宙网') { if(stars>=2 && meteors>=2 && attacks>=2 && moons>=2) breakdown.objective += 40; } 
             else if(u.data.name === '河外丝状结构') { if(stars>=3 && meteors>=2 && (attacks>=1 || moons>=1)) breakdown.objective += 35; }
        });
        breakdown.total = breakdown.current + breakdown.combo + breakdown.nebula + breakdown.objective;
        return breakdown;
    }

    function startRound() {
        if(state.round > state.maxRounds) { endGame(); return; }
        state.gamePhase = 'DRAFT';
        state.passedPlayers.clear();
        state.players.forEach(p => { p.passed = false; p.hand = []; }); 
        updateUI();
        log(`=== 第 ${state.round} 回合：轮抽阶段 ===`);
        state.draftPacks = [[], [], [], []];
        for(let i=0; i<4; i++) { for(let j=0; j<7; j++) { if(state.deck.length > 0) state.draftPacks[i].push(state.deck.pop()); } }
        runDraftUI();
    }

    function runDraftUI() {
        if(state.players[0].hand.length >= 7) {
            log("轮抽结束，进入出牌阶段！");
            document.getElementById('draft-overlay').style.display = 'none';
            state.gamePhase = 'PLAY';
            state.currentPlayer = 0;
            updateUI();
            checkTurn();
            return;
        }
        document.getElementById('draft-overlay').style.display = 'flex';
        const container = document.getElementById('draft-container');
        container.innerHTML = '';
        state.draftPacks[0].forEach((card, idx) => {
            const el = createCardElement(card);
            el.onclick = () => {
                state.players[0].hand.push(state.draftPacks[0].splice(idx, 1)[0]);
                aiDraft();
                const last = state.draftPacks.pop();
                state.draftPacks.unshift(last);
                runDraftUI();
            };
            container.appendChild(el);
        });
    }

    function aiDraft() {
        for(let i=1; i<4; i++) {
            const pack = state.draftPacks[i];
            if(pack.length > 0) {
                let pick = pack.findIndex(c => c.type === 'Nebula');
                if(pick === -1) pick = pack.findIndex(c => c.type === 'Star');
                if(pick === -1) pick = 0;
                state.players[i].hand.push(pack.splice(pick, 1)[0]);
            }
        }
    }

    function checkTurn() {
        updateUI();
        if(state.passedPlayers.size === 4) { endRoundLogic(); return; }
        const curr = state.players[state.currentPlayer];
        if(curr.passed) { nextTurn(); return; }
        if(!curr.isHuman) {
            document.querySelectorAll('.opponent')[curr.id-1].classList.add('active');
            setTimeout(() => aiPlay(curr), 800);
        } else {
            document.querySelectorAll('.opponent').forEach(e=>e.classList.remove('active'));
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-pass').disabled = false;
            log("👉 轮到你了！");
        }
    }

    function attemptPlay() {
        const hand = state.players[0].hand;
        const selected = hand.filter(c => c.selected);
        if(selected.length === 0) return alert("请先选牌！");
        const res = validateCombo(selected);
        if(res.valid) {
            if(res.reqDiscard) {
                if(selected.length !== 3) return alert("【流星雨】需选择3张牌：流星雨+流星+弃牌");
                if(!selected.some(c=>c.name.includes('流星雨')) || !selected.some(c=>c.type==='Meteor')) return alert("组合错误");
            }
            executePlay(0, selected, res);
        } else { alert("❌ 无效组合: " + res.reason); }
    }

    function validateCombo(cards) {
        const types = cards.map(c => c.type);
        const len = cards.length;
        
        // Single Event Play
        if(len === 1 && cards[0].isEvent) {
            if(cards[0].effect === 'meteorShower') return {valid:false, reason:"流星雨需配合流星使用"};
            if(cards[0].effect === 'starPower') return {valid:false, reason:"星辰闪耀需配合1张星星使用"}; 
            // 注意：小行星带单出是抽1张(fallback)，或者不允许单出？
            // Plan C 建议：如果不想卡手，允许单出。这里设定为允许单出，效果为 'mining' (抽1+回收)
            // 如果是组合打出，下面会拦截。
            return {valid:true, type:'Event', data:cards[0]};
        }
        
        // Basic Combos
        if(len===3 && types.every(t=>t==='Star')) return {valid:true, type:'Star', name:'星座组合', endScore:6};
        if(len===3 && types.every(t=>t==='Meteor')) return {valid:true, type:'Meteor', name:'流星许愿', endScore:3};
        if(len===2 && types.every(t=>t==='Nebula')) return {valid:true, type:'Nebula', name:'星云(成长)', endScore:0}; 
        if(cards.some(c=>c.effect==='meteorShower') && len===3 && types.includes('Meteor') && types.includes('Event')) return {valid:true, type:'Meteor', name:'流星雨(事件)', endScore:3, reqDiscard:true};
        if(len===2 && types.includes('Astronaut') && types.includes('Rocket')) return {valid:true, type:'Moon', name:'登月成功', endScore:4};
        if(len===2 && types.includes('Meteorite') && types.includes('Star')) return {valid:true, type:'Attack', name:'陨石打击', endScore:0};
        
        // Star Event
        if(len===2 && cards.some(c=>c.effect==='starPower') && cards.some(c=>c.type==='Star')) return {valid:true, type:'StarEvent', name:'星辰闪耀', endScore:0};
        
        // [新增] 引力捕获 (4 cards: 1 Mining + 1 Meteorite + 2 Star)
        if(len===4 && 
           cards.some(c=>c.effect==='mining') && 
           cards.filter(c=>c.type==='Meteorite').length===1 && 
           cards.filter(c=>c.type==='Star').length===2) {
            return {valid:true, type:'Steal', name:'引力捕获', endScore:0};
        }
        
        return {valid:false, reason:"不符合规则"};
    }

    function executePlay(pid, cards, combo) {
        const p = state.players[pid];
        p.hand = p.hand.filter(h => !cards.some(c => c.uid === h.uid));
        let displayCards = [...cards];
        if(combo.reqDiscard) {
            const discard = cards.find(c => c.type !== 'Meteor' && c.effect !== 'meteorShower');
            if(discard) { state.discardPile.push(discard); displayCards = cards.filter(c => c !== discard); }
        }
        
        // [新增] 夺取逻辑
        if(combo.type === 'Steal') {
            cards.forEach(c => state.discardPile.push(c)); // 消耗牌进入弃牌堆
            log(`🌌 ${p.name} 发动了 [引力捕获]！`);
            
            if(pid === 0) { // 玩家操作
                // 检查是否有合法目标
                const hasTargets = state.players.some(pl => pl.id !== 0 && pl.combos.length > 0);
                if(hasTargets) {
                    state.targetingAction = 'STEAL'; // 设置为夺取模式
                    enterTargetingMode();
                    return; // 暂停流程
                } else {
                    log("场上无可夺取的目标，技能空放。");
                    updateUI();
                    nextTurn();
                    return;
                }
            } else {
                // AI 操作 (自动夺取)
                aiSteal(pid);
                updateUI();
                nextTurn();
                return;
            }
        }

        if(combo.type === 'StarEvent' && pid === 0) {
            state.discardPile.push(cards.find(c=>c.isEvent)); 
            state.discardPile.push(cards.find(c=>c.type==='Star'));
            log(`${p.name} 发动星辰闪耀！`);
            showModal(`${p.name} 的星辰闪耀`, "请选择效果", 
                [{name:'星愿谐鸣', desc:'视为打出一组星座(+6分)', icon:'⭐', type:'Star', img:'star.jpg'},{name:'星之恩赐', desc:'现有每组星座抽1张牌', icon:'🃏', type:'Event', img:'image_6.png'}],
                (idx) => {
                    hideModal();
                    if(idx === 0) {
                        p.combos.push({ name: '星愿谐鸣', type: 'Star', endScore: 6, cards: [], round: state.round });
                        log(">>> 召唤了 [星愿谐鸣]");
                    } else {
                        const starCount = p.combos.filter(c => c.type === 'Star').length;
                        if(starCount > 0) { drawCards(pid, starCount); log(`>>> 获得了星之恩赐，抽取 ${starCount} 张牌`); } 
                        else { log(">>> 星之恩赐失效：你当前没有星座组合。"); }
                    }
                    updateUI();
                    nextTurn();
                }
            );
            return;
        } else if (combo.type === 'StarEvent' && pid !== 0) {
            state.discardPile.push(cards.find(c=>c.isEvent)); 
            state.discardPile.push(cards.find(c=>c.type==='Star'));
            p.combos.push({ name: '星愿谐鸣', type: 'Star', endScore: 6, cards: [], round: state.round });
            log(`${p.name} 召唤了 [星愿谐鸣]`);
            updateUI();
            nextTurn();
            return;
        }

        if(combo.type === 'Event') {
            state.discardPile.push(cards[0]);
            log(`${p.name} 发动事件：${combo.data.name}`);
            applyEventEffect(pid, combo.data.effect);
        } else {
            p.combos.push({ name: combo.name, type: combo.type, endScore: combo.endScore, cards: displayCards, round: state.round });
            p.score += (combo.score || 0);
            log(`${p.name} 打出 [${combo.name}]`);
            
            if(combo.type === 'Attack') { 
                p.score += 1; 
                if(pid===0) { 
                    const hasTargets = state.players.some(pl => pl.id !== 0 && pl.combos.length > 0);
                    if(hasTargets) { 
                        state.targetingAction = 'DESTROY'; // 设置为摧毁模式
                        enterTargetingMode(); 
                        return; 
                    } 
                    else { log("无目标，陨石落空。"); updateUI(); nextTurn(); return; }
                } 
                else aiMeteorStrike(pid);
            }
            if(combo.type === 'Moon') drawCards(pid, 1);
            if(combo.type === 'Meteor') {
                if(pid === 0) { handleWish(pid); return; }
                else { if(p.hand.length < 3) drawCards(pid, 2); else p.score += 3; }
            }
        }
        updateUI();
        if(!state.targetingMode) nextTurn();
    }
    
    function applyEventEffect(pid, effect) {
        const p = state.players[pid];
        if(effect === 'draw2') drawCards(pid, 2);
        if(effect === 'blackhole') { state.players.forEach(pl => { if(pl.id !== pid && pl.hand.length > 0) state.deck.push(pl.hand.pop()); }); shuffle(state.deck); log("黑洞触发：全场重洗"); }
        if(effect === 'drawRocket') { const count = p.combos.filter(c => c.type === 'Moon' && c.round === state.round).length; if(count>0) { drawCards(pid, count); log(`摘星揽月：抽 ${count} 张`); } }
        // 小行星带单出时的效果 (fallback)
        if(effect === 'mining') {
            drawCards(pid, 1); 
            const meteoriteIdx = state.discardPile.findIndex(c => c.type === 'Meteorite');
            if(meteoriteIdx !== -1) {
                const recovered = state.discardPile.splice(meteoriteIdx, 1)[0];
                p.hand.push(recovered);
                log("⛏️ 深空开采：回收了一枚 [陨石]！");
            } else {
                log("⛏️ 深空开采：抽1张牌 (未发现陨石)");
            }
        }
    }

    function handleWish(pid) {
        if(pid === 0) {
            showModal("🌠 流星许愿", "请选择你的愿望", 
                [{name:'贪婪', desc:'抽取 2 张牌', icon:'🃏'}, {name:'声望', desc:'立即 +3 分', icon:'🏆'}, {name:'野心', desc:'抽取 1 张终极目标卡', icon:'📜'}].map(x=>({...x, type:'Event'})),
                (idx) => {
                    hideModal();
                    if(idx===0) { drawCards(0, 2); log("许愿：抽了2张牌"); }
                    if(idx===1) { state.players[0].score += 3; log("许愿：获得3分"); }
                    if(idx===2) {
                        if(state.ultimateDeck.length > 0) {
                            const ult = state.ultimateDeck.pop();
                            state.players[0].ultimateObjs.push(ult);
                            state.players[0].combos.push({name:'终极目标', type:'Ultimate', data:ult, endScore:0});
                            alert(`获得：${ult.name}`);
                            updateHUD(); 
                        } else { alert("卡没了，抽牌补偿"); drawCards(0, 2); }
                    }
                    updateUI();
                    nextTurn();
                }
            );
        }
    }

    function drawCards(pid, num) { for(let i=0; i<num; i++) if(state.deck.length>0) state.players[pid].hand.push(state.deck.pop()); }
    
    function enterTargetingMode() { 
        state.gamePhase = 'TARGETING'; 
        state.targetingMode = true; 
        
        // 根据行动类型显示不同的提示
        const hud = document.getElementById('targeting-hud');
        if(state.targetingAction === 'STEAL') {
            hud.innerText = "🌀 引力捕获：选择一个组合将其夺取！（无法触发进场效果）";
            hud.className = "hud-steal";
            document.body.classList.add('mode-steal'); // 开启紫色样式
        } else {
            hud.innerText = "☄️ 陨石打击：选择一个组合进行摧毁！";
            hud.className = "";
            document.body.classList.remove('mode-steal');
        }
        
        document.body.classList.add('targeting-active');
        document.getElementById('targeting-hud').style.display = 'block'; 
        updateUI(); 
    }
    
    window.handleTokenClick = function(targetPid, comboIdx) {
        if(!state.targetingMode) return;
        const targetP = state.players[targetPid];
        const combo = targetP.combos[comboIdx];
        
        if(!combo) return;

        if(combo.type === 'Ultimate') {
            alert("⚠️ 警告：无法对【终极目标】进行操作！");
            return;
        }

        // [逻辑分支] 夺取 vs 摧毁
        if(state.targetingAction === 'STEAL') {
            if(confirm(`确认夺取 ${targetP.name} 的 [${combo.name}] ?`)) {
                // 1. 从对方移除
                const stolenCombo = targetP.combos.splice(comboIdx, 1)[0];
                // 2. 加入己方 (保留原始 round 以便计算某些效果，或者重置 round)
                state.players[0].combos.push(stolenCombo);
                
                log(`🌀 成功夺取了 ${targetP.name} 的 [${combo.name}]！`);
                
                endTargeting();
            }
        } else {
            // DESTROY 逻辑
            if(confirm(`摧毁 ${targetP.name} 的 [${combo.name}] ?`)) {
                const dead = targetP.combos.splice(comboIdx, 1)[0];
                if(dead.cards) dead.cards.forEach(c => state.deck.unshift(c));
                log(`☄️ 摧毁了 ${targetP.name} 的组合`);
                
                endTargeting();
            }
        }
    }
    
    function endTargeting() {
        state.targetingMode = false;
        state.gamePhase = 'PLAY';
        state.targetingAction = null;
        document.body.classList.remove('targeting-active');
        document.body.classList.remove('mode-steal');
        document.getElementById('targeting-hud').style.display = 'none';
        updateUI();
        nextTurn();
    }

    function aiSteal(attackerId) {
        const p = state.players[attackerId];
        // AI 简单策略：随机抢一个非终极目标
        const targets = [];
        state.players.forEach(pl => {
            if(pl.id !== attackerId) {
                pl.combos.forEach((c, idx) => {
                    if(c.type !== 'Ultimate') targets.push({pid: pl.id, idx: idx});
                });
            }
        });
        
        if(targets.length > 0) {
            const t = targets[Math.floor(Math.random()*targets.length)];
            const victim = state.players[t.pid];
            const stolen = victim.combos.splice(t.idx, 1)[0];
            p.combos.push(stolen);
            log(`🤖 电脑 ${p.name} 夺取了 ${victim.name} 的 [${stolen.name}]！`);
        } else {
            log("电脑没有找到可夺取的目标。");
        }
    }

    function aiMeteorStrike(attackerId) {
        const targets = [];
        state.players.forEach(p => {
            if(p.id !== attackerId) {
                p.combos.forEach((c, idx) => {
                    if(c.type !== 'Ultimate') targets.push({pid: p.id, idx: idx});
                });
            }
        });
        
        if(targets.length > 0) {
            const t = targets[Math.floor(Math.random()*targets.length)];
            const victim = state.players[t.pid];
            const dead = victim.combos.splice(t.idx, 1)[0];
            if(dead.cards) dead.cards.forEach(c => state.deck.unshift(c));
            log(`☄️ 电脑摧毁了 ${victim.name} 的 [${dead.name}]`);
        }
    }

    function aiPlay(bot) {
        const hand = bot.hand;
        
        // AI 尝试使用引力捕获
        const stealCheck = validateCombo(hand); // AI 目前的手牌校验比较简单，这里可能无法直接触发复杂的4张牌combo
        // 为了简化，只有当 AI 凑巧拿到这4张牌时才会打出。
        const asteroid = hand.find(c=>c.effect==='mining');
        const meteorite = hand.find(c=>c.type==='Meteorite');
        const stars = hand.filter(c=>c.type==='Star');
        if(asteroid && meteorite && stars.length >= 2) {
            return executePlay(bot.id, [asteroid, meteorite, stars[0], stars[1]], {type:'Steal'});
        }

        const star = hand.find(c=>c.type==='Star');
        const starEvent = hand.find(c=>c.effect==='starPower');
        if(star && starEvent) return executePlay(bot.id, [star, starEvent], validateCombo([star, starEvent]));

        const nebulas = hand.filter(c=>c.type==='Nebula');
        if(nebulas.length >= 2) return executePlay(bot.id, nebulas.slice(0,2), validateCombo(nebulas.slice(0,2)));
        const meteors = hand.filter(c=>c.type==='Meteor');
        if(meteors.length >= 3) return executePlay(bot.id, meteors.slice(0,3), validateCombo(meteors.slice(0,3)));
        // stars...
        const astro = hand.find(c=>c.type==='Astronaut');
        const rocket = hand.find(c=>c.type==='Rocket');
        if(astro && rocket) return executePlay(bot.id, [astro,rocket], validateCombo([astro,rocket]));
        
        // 尝试单出 Event
        if(asteroid) return executePlay(bot.id, [asteroid], {type:'Event', data:asteroid});

        bot.passed = true;
        state.passedPlayers.add(bot.id);
        log(`${bot.name} 跳过。`);
        checkTurn();
    }

    function passTurn() { state.players[0].passed = true; state.passedPlayers.add(0); state.players[0].hand.forEach(c=>c.selected=false); log("跳过回合。"); nextTurn(); }
    function nextTurn() { state.currentPlayer = (state.currentPlayer + 1) % 4; checkTurn(); }

    function endRoundLogic() {
        log(`=== 第 ${state.round} 回合结束 ===`);
        let recycleBin = [...state.deck, ...state.discardPile];
        state.players.forEach(p => {
            const handScore = p.hand.reduce((s,c) => s+(c.score||0), 0);
            p.score += handScore;
            p.hand.forEach(c => c.selected = false);
            recycleBin = recycleBin.concat(p.hand);
            p.hand = [];
            p.combos.forEach(c => { 
                if(c.cards) {
                    c.cards.forEach(card => card.selected = false);
                    recycleBin = recycleBin.concat(c.cards); 
                }
                c.cards = []; 
            });
        });
        
        recycleBin.forEach(c => c.selected = false);
        state.deck = shuffle(recycleBin);
        state.discardPile = [];
        const potentialWinner = state.players.find(p => calculateFinalScore(p).total >= state.targetScore);
        if(potentialWinner || state.round >= state.maxRounds) {
            setTimeout(endGame, 1000);
        } else {
            state.round++;
            setTimeout(startRound, 2000);
        }
    }

    function endGame() {
        state.gamePhase = 'END';
        log("=== 最终计分 ===");
        let msg = "";
        let winner = state.players[0];
        let maxScore = -1;

        state.players.forEach(p => {
            const finalStats = calculateFinalScore(p);
            p.score = finalStats.total;
            if(p.score > maxScore) { maxScore = p.score; winner = p; }
            msg += `<div style="margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">
                <div style="font-weight:bold; color:#facc15">${p.name}: ${finalStats.total}分</div>
                <div style="font-size:12px; color:#cbd5e1">基础:${finalStats.current} | 组合:${finalStats.combo} | 星云:${finalStats.nebula} | 目标:${finalStats.objective}</div>
            </div>`;
        });
        
        document.getElementById('winner-name').innerText = `🏆 冠军: ${winner.name}`;
        document.getElementById('final-scores').innerHTML = msg;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function updateHUD() {
        const hud = document.getElementById('objective-content');
        let html = '';
        if(state.players[0].objective) html += `<div class="hud-item"><strong style="color:#facc15">${state.players[0].objective.name}</strong><br>${state.players[0].objective.desc}</div>`;
        state.players[0].ultimateObjs.forEach(u => { html += `<div class="hud-item"><strong style="color:#f472b6">${u.name}</strong><br>${u.desc}</div>`; });
        hud.innerHTML = html || '无';
    }

    function updateUI() {
        document.getElementById('round-badge').innerText = `Round ${state.round} / ${state.maxRounds}`;
        document.getElementById('phase-badge').innerText = state.gamePhase === 'DRAFT' ? '轮抽' : '出牌';
        
        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        state.players[0].hand.forEach(c => { handDiv.appendChild(createCardElement(c)); });

        const scoreBody = document.getElementById('score-body');
        scoreBody.innerHTML = '';
        state.players.forEach(pl => {
            let indexedCombos = pl.combos.map((c, i) => ({...c, originalIndex: i}));
            const typeOrder = {'Ultimate':0, 'Star':1, 'Meteor':2, 'Moon':3, 'Attack':4, 'Nebula':5};
            indexedCombos.sort((a, b) => (typeOrder[a.type]||99) - (typeOrder[b.type]||99));

            let comboHtml = indexedCombos.map((c) => {
                const isTarget = state.targetingMode && pl.id !== 0; 
                let tokenClass = c.type === 'Nebula' ? 'token-Nebula' : (c.type === 'Ultimate' ? 'token-Ultimate' : '');
                if(c.type === 'Star') tokenClass = 'token-Star';
                if(c.type === 'Meteor') tokenClass = 'token-Meteor';
                
                return `<span class="combo-token ${tokenClass} ${isTarget?'targetable':''}" ${isTarget ? `onclick="handleTokenClick(${pl.id}, ${c.originalIndex})"` : ''}>${c.name}</span>`;
            }).join('');
            
            scoreBody.innerHTML += `<tr><td style="${state.currentPlayer===pl.id?'color:#facc15':''}">${pl.name}</td><td style="font-weight:bold; color:#facc15">${pl.score}</td><td>${comboHtml || '-'}</td></tr>`;
        });

        const oppArea = document.getElementById('opponents-area');
        oppArea.innerHTML = '';
        for(let i=1; i<4; i++) {
            const p = state.players[i];
            oppArea.innerHTML += `<div class="opponent ${state.currentPlayer===i?'active':''}"><div class="opponent-avatar">🤖</div><div>${p.name}</div><div style="font-size:20px">🎴 x${p.hand.length}</div></div>`;
        }

        const isMyTurn = state.currentPlayer === 0 && !state.players[0].passed && state.gamePhase === 'PLAY';
        document.getElementById('btn-play').disabled = !isMyTurn;
        document.getElementById('btn-pass').disabled = !isMyTurn;
    }

    function createCardElement(c) {
        const div = document.createElement('div');
        div.className = `card ${c.selected?'selected':''}`;
        elFn = () => { if(state.gamePhase==='PLAY'||state.gamePhase==='DRAFT'||state.gamePhase==='INIT') { if(state.gamePhase==='PLAY') c.selected = !c.selected; updateUI(); } };
        const imgSrc = c.img || IMAGE_MAP[c.type] || 'bg.jpg';
        if(c.type === 'Objective' || c.type === 'Ultimate') {
            div.innerHTML = `<div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px; background:#0f172a;"><div style="font-size:30px; margin-bottom:10px;">📜</div><div style="font-weight:bold; color:#facc15; font-size:12px;">${c.name}</div><div style="font-size:10px; color:#cbd5e1; margin-top:5px;">${c.desc}</div></div>`;
        } else {
            div.innerHTML = `<div class="card-img-box"><img src="${imgSrc}" onerror="this.src='bg.jpg'"></div><div class="card-info"><div class="card-name">${c.name}</div><div class="card-desc">${c.desc||''}</div></div>`;
        }
        div.onclick = elFn;
        return div;
    }
    function showModal(title, desc, choices, callback) { const m=document.getElementById('modal-window'); document.getElementById('modal-title').innerText=title; document.getElementById('modal-desc').innerText=desc; const b=document.getElementById('modal-body'); b.innerHTML=''; choices.forEach((c,i)=>{const e=createCardElement(c);e.onclick=()=>callback(i);b.appendChild(e);}); m.style.display='flex'; }
    function hideModal() { document.getElementById('modal-window').style.display='none'; }
    function log(m) { const d=document.getElementById('game-log'); d.innerHTML+=`<div>> ${m}</div>`; d.scrollTop=d.scrollHeight; }

    initGame();
</script>
</body>
</html>
