<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仰望星空 (4人热座 - 最终优化版)</title>
    <style>
        /* --- 全局与背景 --- */
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            user-select: none; color: #e2e8f0; 
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('bg.jpg');
            background-size: cover; background-position: center bottom; background-repeat: no-repeat;
            background-color: #0f172a; 
        }
        
        #main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 60px 1fr 260px;
            height: 100vh; gap: 15px; padding: 15px; box-sizing: border-box;
        }

        .panel { 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; padding: 15px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; 
        }

        /* --- 顶部信息 --- */
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { margin: 0; font-size: 26px; color: #e2e8f0; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .status-group { display: flex; gap: 15px; align-items: center; }
        .status-badge { background: rgba(59, 130, 246, 0.8); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.2); }
        
        #current-player-badge { 
            background: linear-gradient(135deg, #facc15 0%, #a16207 100%); 
            color: #fff; font-size: 18px; padding: 8px 20px; 
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
            animation: pulse 2s infinite;
        }

        /* --- 侧边栏 --- */
        aside { grid-row: 2 / -1; gap: 15px; overflow: hidden; }
        #scoreboard-container { flex: 1; overflow-y: auto; }
        #scoreboard table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        #scoreboard th { text-align: left; color: #94a3b8; padding: 5px; font-size: 12px; }
        #scoreboard td { padding: 8px; background: rgba(255,255,255,0.05); }
        .active-row { border: 2px solid #facc15; background: rgba(250, 204, 21, 0.1) !important; }

        .combo-token { display: inline-block; background: #334155; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; border: 1px solid #475569; cursor: default; }
        .token-Star { border-color: #facc15; color: #fef08a; } /* 星星淡黄 */
        .token-Meteor { border-color: #38bdf8; color: #bae6fd; } /* 流星淡蓝 */
        .token-Moon { border-color: #94a3b8; color: #f8fafc; } /* 登月银白 */
        .token-Nebula { background: #701a75; border-color: #d8b4fe; color: #f5d0fe; } /* 星云紫 */
        .token-Ultimate { background: #be185d; border-color: #f472b6; color: #fff; border-width: 2px; } /* 终极红 */
        
        .combo-token.targetable { cursor: pointer; border-color: #ef4444; background: #7f1d1d; color: #fca5a5; animation: shake 0.5s infinite; }

        #game-log { height: 150px; background: rgba(0,0,0,0.6); color: #86efac; font-family: monospace; padding: 10px; border-radius: 8px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        #objective-hud { background: rgba(6, 78, 59, 0.6); border: 1px solid #10b981; padding: 10px; border-radius: 8px; font-size: 12px; color: #d1fae5; flex-shrink: 0; }

        /* --- 游戏区 --- */
        #game-center { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; padding-top: 20px; }
        
        /* 轮抽区域 */
        #draft-area { display:none; flex-direction: column; align-items: center; width: 100%; }
        #draft-title { color:#facc15; font-size:24px; margin-bottom:10px; font-weight:bold; text-shadow:0 0 10px black; }
        #draft-container .card { transform: scale(1.1); margin: 0 10px; }
        #draft-container .card:hover { transform: scale(1.2) translateY(-10px); border-color: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.5); }

        /* --- 底部玩家区 --- */
        #player-area { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; align-items: center; position: relative; justify-content: flex-end; transition: all 0.5s; }
        .card-container { display: flex; gap: 10px; justify-content: center; padding: 10px; min-height: 180px; perspective: 1000px; z-index: 10; }
        
        .card {
            width: 120px; height: 180px; border-radius: 12px;
            background: #1e293b; border: 2px solid #475569;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer; position: relative;
            transition: transform 0.2s, border-color 0.2s;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .card-img-box { width: 100%; height: 65%; background: #0f172a; position: relative; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { width: 100%; height: 35%; background: rgba(30, 41, 59, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; border-top: 1px solid rgba(255,255,255,0.1); }
        .card-name { font-size: 13px; font-weight: bold; color: #f1f5f9; margin-bottom: 2px; }
        .card-desc { font-size: 10px; color: #94a3b8; text-align: center; line-height: 1.1; }

        .card:hover { transform: translateY(-15px); border-color: #cbd5e1; z-index: 20; }
        .card.selected { transform: translateY(-25px); border-color: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.6); }
        
        .hand-dimmed .card { opacity: 0.7; cursor: not-allowed; }
        .hand-dimmed .card:hover { transform: none; border-color: #475569; }

        .btn-group { margin-top: 15px; display: flex; gap: 20px; z-index: 20; }
        button { padding: 10px 40px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; background: #facc15; color: #0f172a; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #eab308; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        button.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

        /* --- 幕布 & 模态框 --- */
        #turn-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 500; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        #curtain-msg { font-size: 40px; color: #facc15; margin-bottom: 20px; font-weight: bold; text-align: center; }
        #curtain-sub { font-size: 20px; color: #cbd5e1; margin-bottom: 40px; }
        .curtain-btn { font-size: 24px; padding: 20px 60px; border-radius: 50px; animation: pulse 2s infinite; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 600; display: none; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #475569; text-align: center; min-width: 600px; max-width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

        #game-over-screen { display:none; position: fixed; top:0; left:0; width:100%; height:100%; z-index:300; flex-direction:column; justify-content:center; align-items:center; color:white; background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.95)), url('image_9.png'); background-size: cover; background-position: center; }
        
        #targeting-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 550; display: flex; justify-content: center; padding-top: 100px; pointer-events: none; }
        #targeting-msg { background: #ef4444; color: white; padding: 10px 30px; font-weight: bold; border-radius: 30px; pointer-events: auto; animation: pulse 1s infinite; box-shadow: 0 0 20px #ef4444; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<div id="turn-curtain">
    <div id="curtain-msg">等待玩家操作</div>
    <div id="curtain-sub">请将鼠标交给下一位玩家</div>
    <button class="curtain-btn" onclick="hideCurtain()">我是该玩家，开始</button>
</div>

<div id="modal-window" class="modal-overlay">
    <div class="modal-content">
        <h2 id="modal-title" style="color:#facc15; font-size:28px; margin-bottom:20px;">标题</h2>
        <p id="modal-desc" style="color:#cbd5e1; margin-bottom:30px; font-size:16px;">描述文字</p>
        <div id="modal-body" class="modal-choices"></div>
    </div>
</div>

<div id="targeting-overlay" style="display:none;">
    <div id="targeting-msg">☄️ 陨石打击：请点击左侧计分板，选择一个对手的组合进行摧毁！</div>
</div>

<div id="game-over-screen">
    <div id="game-over-content">
        <h1 style="font-size: 60px; color: #facc15; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,0,0,0.5);">🌟 游戏结束 🌟</h1>
        <div id="winner-name" style="font-size: 30px; color: #fff; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,0,0,0.5);">冠军: ???</div>
        <div id="final-scores" style="text-align: left; background: rgba(15, 23, 42, 0.8); padding: 30px; border-radius: 16px; margin-bottom: 30px; min-width: 400px; max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);"></div>
        <button class="restart-btn" onclick="resetGame()">✨ 开启新的旅程</button>
    </div>
</div>

<div id="main-layout">
    <header>
        <h1>仰望星空 <span style="font-size:12px; opacity:0.6; letter-spacing:1px">FINAL TEST VER</span></h1>
        <div class="status-group">
            <div class="status-badge" id="round-badge">Round 1 / 6</div>
            <div class="status-badge badge-red" id="phase-badge">...</div>
            <div class="status-badge" id="current-player-badge">当前：玩家 1</div>
        </div>
    </header>

    <aside class="panel">
        <h3 style="color:#facc15; margin-top:0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">📊 战况统计</h3>
        <div id="scoreboard-container">
            <div id="scoreboard">
                <table>
                    <thead><tr><th>玩家</th><th>分数</th><th>组合</th></tr></thead>
                    <tbody id="score-body"></tbody>
                </table>
            </div>
        </div>
        
        <div style="margin-top:10px; font-weight:bold; color:#94a3b8; font-size:12px">系统日志</div>
        <div id="game-log"></div>

        <div id="objective-hud">
            <div class="hud-title">📜 你的目标</div>
            <div id="objective-content">加载中...</div>
        </div>
    </aside>

    <div id="game-center">
        <div id="draft-area">
            <div id="draft-title">🔄 轮抽阶段：请从上方选择一张牌拿走</div>
            <div id="draft-container" class="card-container"></div>
        </div>
    </div>

    <div id="player-area" class="panel" style="background:transparent; border:none; box-shadow:none;">
        <div style="color:#94a3b8; margin-bottom:5px; font-size:14px; text-align:center;">
            <span id="hand-owner-label">玩家的手牌</span> 
            <span id="draft-hint" style="color:#facc15; font-weight:bold; display:none;">(这是你已拥有的牌，不可点击)</span>
        </div>
        <div id="player-hand" class="card-container"></div>
        <div class="btn-group" id="play-buttons">
            <button onclick="attemptPlay()" id="btn-play">打出组合</button>
            <button onclick="passTurn()" class="secondary" id="btn-pass">跳过回合</button>
        </div>
    </div>
</div>

<script>
    /* ================= 数据定义 ================= */
    const CARD_DEFINITIONS = [
        { type: 'Star', name: '星星', count: 14, score: 1, desc: '3张=星座(+5)', img: 'star.jpg' },
        { type: 'Meteor', name: '流星', count: 9, score: 1, desc: '3张=许愿', img: 'meteor.jpg' },
        
        // [调整] 陨石数量从 6 减少到 3
        { type: 'Meteorite', name: '陨石', count: 3, score: 0, desc: '配星星=摧毁', img: 'meteorite.jpg' },
        
        { type: 'Astronaut', name: '太空人', count: 6, score: 1, desc: '配火箭=登月(+4)', img: 'astronaut.jpg' },
        { type: 'Rocket', name: '火箭', count: 6, score: 1, desc: '配太空人=登月(+4)', img: 'rocket.jpg' },
        { type: 'Nebula', name: '星云', count: 8, score: 1, desc: '2张=成长分', img: 'nebula.jpg' },
        { type: 'Event', name: '事件:星雨', count: 1, isEvent: true, effect: 'draw2', desc: '打出抽2张', img: 'image_2.png' },     
        { type: 'Event', name: '事件:黑洞', count: 1, isEvent: true, effect: 'blackhole', desc: '全场重洗', img: 'image_7.png' },   
        { type: 'Event', name: '事件:流星雨', count: 1, isEvent: true, effect: 'meteorShower', desc: '配流星+弃牌=许愿', img: 'image_3.png' }, 
        { type: 'Event', name: '事件:星辰闪耀', count: 1, isEvent: true, effect: 'scoreStars', desc: '星星组合+3分', img: 'image_6.png' },  
        { type: 'Event', name: '事件:摘星揽月', count: 1, isEvent: true, effect: 'drawRocket', desc: '火箭组合抽1张', img: 'image_5.png' }, 
        { type: 'Event', name: '事件:小行星带', count: 1, isEvent: true, effect: 'drawStone', desc: '陨石组合抽1张', img: 'image_4.png' } 
    ];

    const BASIC_OBJECTIVES = [
        { name: '仙女座星系', desc: '3组流星 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Meteor').length>=3 },
        { name: '蜂巢星系', desc: '4组星星 (+12分)', bonus: 12, check: (c)=>c.filter(x=>x.type==='Star').length>=4 },
        { name: '漩涡星系', desc: '2星星+2流星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Meteor').length>=2 },
        { name: '触须星系', desc: '2陨石+2火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Attack').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '车轮星系', desc: '2星星+2陨石 (+13分)', bonus: 13, check: (c)=>c.filter(x=>x.type==='Star').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '喷流星系', desc: '4组火箭 (+14分)', bonus: 14, check: (c)=>c.filter(x=>x.type==='Moon').length>=4 },
        { name: '猎户星云', desc: '2流星+2火箭 (+16分)', bonus: 16, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Moon').length>=2 },
        { name: '草帽星系', desc: '2组流星+2组陨石 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Meteor').length>=2 && c.filter(x=>x.type==='Attack').length>=2 },
        { name: '双子星系', desc: '2组星云+2组星星 (+15分)', bonus: 15, check: (c)=>c.filter(x=>x.type==='Nebula').length>=2 && c.filter(x=>x.type==='Star').length>=2 }
    ];

    const ULTIMATE_OBJECTIVES = [
        { name: '河外丝状结构', desc: '4组星星, 2组流星, 1组陨石或火箭 (+30分)', bonus: 30, type: 'Ultimate' },
        { name: '宇宙网', desc: '2组星星, 2组流星, 2组陨石, 2组火箭 (+40分)', bonus: 40, type: 'Ultimate' }
    ];

    let state = {
        round: 1, maxRounds: 6, targetScore: 70, 
        players: [], deck: [], discardPile: [], ultimateDeck: [], 
        draftPacks: [], currentPlayer: 0, draftPlayerIdx: 0, draftRoundCount: 0,
        passedPlayers: new Set(), gamePhase: 'INIT', targetingMode: false
    };

    function initGame() {
        log(">>> 游戏初始化 (Final Test Ver)...");
        state.deck = createDeck();
        state.ultimateDeck = shuffle([...ULTIMATE_OBJECTIVES]); 
        state.round = 1;
        state.discardPile = [];
        state.passedPlayers = new Set();
        state.targetingMode = false;
        
        state.players = [
            { id: 0, name: "玩家 1", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 1, name: "玩家 2", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 2, name: "玩家 3", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] },
            { id: 3, name: "玩家 4", isHuman: true, hand: [], score: 0, combos: [], objective: null, ultimateObjs: [] }
        ];

        document.getElementById('game-over-screen').style.display = 'none';
        let objDeck = shuffle([...BASIC_OBJECTIVES]);
        state.players.forEach(p => p.objective = objDeck.pop());
        startRound();
    }

    function resetGame() { initGame(); }
    function createDeck() {
        let newDeck = [];
        CARD_DEFINITIONS.forEach(def => {
            for(let i=0; i<def.count; i++) newDeck.push({ ...def, uid: Math.random().toString(36).substr(2, 9), selected: false });
        });
        return shuffle(newDeck);
    }
    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function startRound() {
        if(state.round > state.maxRounds) { endGame(); return; }
        state.gamePhase = 'DRAFT';
        state.passedPlayers.clear();
        state.players.forEach(p => { p.passed = false; p.hand = []; }); 
        
        state.draftPacks = [[], [], [], []];
        for(let i=0; i<4; i++) { for(let j=0; j<7; j++) { if(state.deck.length > 0) state.draftPacks[i].push(state.deck.pop()); } }
        
        state.draftRoundCount = 0;
        state.draftPlayerIdx = 0;
        log(`=== 第 ${state.round} 回合：轮抽开始 ===`);
        showCurtain(0, "准备开始轮抽");
    }

    function showDraftScreen(playerId) {
        state.currentPlayer = playerId;
        state.gamePhase = 'DRAFT';
        updateUI();
        const draftArea = document.getElementById('draft-area');
        const container = document.getElementById('draft-container');
        draftArea.style.display = 'flex';
        container.innerHTML = '';
        
        document.getElementById('player-area').style.display = 'flex';
        document.getElementById('play-buttons').style.display = 'none';
        document.getElementById('player-hand').classList.add('hand-dimmed');
        document.getElementById('draft-hint').style.display = 'inline';
        
        const currentPack = state.draftPacks[playerId]; 
        currentPack.forEach((card, idx) => {
            const el = createCardElement(card);
            el.onclick = () => handleDraftPick(playerId, idx);
            container.appendChild(el);
        });
    }

    function handleDraftPick(playerId, cardIdx) {
        const pack = state.draftPacks[playerId];
        const pickedCard = pack.splice(cardIdx, 1)[0];
        state.players[playerId].hand.push(pickedCard);
        
        state.draftPlayerIdx++;
        if(state.draftPlayerIdx < 4) {
            showCurtain(state.draftPlayerIdx, "继续轮抽");
        } else {
            state.draftPlayerIdx = 0;
            state.draftRoundCount++;
            const lastPack = state.draftPacks.pop();
            state.draftPacks.unshift(lastPack);
            if(state.players[0].hand.length >= 7) {
                log("轮抽结束，进入出牌阶段！");
                document.getElementById('draft-area').style.display = 'none';
                state.currentPlayer = 0;
                startPlayPhase();
            } else {
                showCurtain(0, "卡包已流转，继续选择");
            }
        }
    }

    function startPlayPhase() {
        state.gamePhase = 'PLAY';
        showCurtain(0, "出牌阶段开始");
    }

    function checkTurn() {
        if(state.passedPlayers.size === 4) { endRoundLogic(); return; }
        if(state.players[state.currentPlayer].passed) { nextTurn(); return; }
        updateUI(); 
        document.getElementById('play-buttons').style.display = 'flex';
        document.getElementById('player-hand').classList.remove('hand-dimmed');
        document.getElementById('draft-hint').style.display = 'none';
        document.getElementById('btn-play').disabled = false;
        document.getElementById('btn-pass').disabled = false;
    }

    function attemptPlay() {
        const hand = state.players[state.currentPlayer].hand;
        const selected = hand.filter(c => c.selected);
        if(selected.length === 0) return alert("请先选牌！");
        const res = validateCombo(selected);
        if(res.valid) {
            if(res.reqDiscard) {
                if(selected.length !== 3) return alert("【流星雨】需选择3张牌：流星雨+流星+弃牌");
                if(!selected.some(c=>c.name.includes('流星雨')) || !selected.some(c=>c.type==='Meteor')) return alert("组合错误");
            }
            executePlay(state.currentPlayer, selected, res);
        } else { alert("❌ 无效组合: " + res.reason); }
    }

    function passTurn() {
        const p = state.players[state.currentPlayer];
        p.passed = true;
        state.passedPlayers.add(state.currentPlayer);
        p.hand.forEach(c=>c.selected=false);
        log(`${p.name} 选择跳过剩余回合。`);
        prepareNextTurn();
    }

    function nextTurn() {
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        checkTurn();
    }
    
    function prepareNextTurn() {
        let nextId = (state.currentPlayer + 1) % 4;
        let loopCount = 0;
        while(state.passedPlayers.has(nextId) && loopCount < 4) {
            nextId = (nextId + 1) % 4;
            loopCount++;
        }
        if(loopCount === 4 || (state.passedPlayers.size === 4)) {
            endRoundLogic();
        } else {
            state.currentPlayer = nextId;
            showCurtain(nextId, "轮到你的回合");
        }
    }

    // --- 核心逻辑调整区 ---

    function executePlay(pid, cards, combo) {
        const p = state.players[pid];
        p.hand = p.hand.filter(h => !cards.some(c => c.uid === h.uid));
        let displayCards = [...cards];
        if(combo.reqDiscard) {
            const discard = cards.find(c => c.type !== 'Meteor' && c.effect !== 'meteorShower');
            if(discard) { state.discardPile.push(discard); displayCards = cards.filter(c => c !== discard); }
        }
        
        if(combo.type === 'Event') {
            state.discardPile.push(cards[0]);
            log(`${p.name} 发动事件：${combo.data.name}`);
            applyEventEffect(pid, combo.data.effect);
        } else {
            p.combos.push({ name: combo.name, type: combo.type, endScore: combo.endScore, cards: displayCards, round: state.round });
            p.score += (combo.score || 0);
            log(`${p.name} 打出 [${combo.name}]`);
            
            // [修复] 陨石逻辑优化：如果没有目标，直接通过，不进 targetingMode
            if(combo.type === 'Attack') { 
                p.score += 1; 
                // 检查场上是否有对手有组合
                const hasTargets = state.players.some(pl => pl.id !== pid && pl.combos.length > 0);
                if(hasTargets) {
                    enterTargetingMode(); 
                    return; // 暂停流程，等待选目标
                } else {
                    log("场上无有效目标，陨石未造成破坏。");
                    updateUI();
                    prepareNextTurn();
                    return;
                }
            }
            if(combo.type === 'Moon') drawCards(pid, 1);
            
            // [修复] 流星许愿时序：先许愿，后切回合
            if(combo.type === 'Meteor') {
                handleWish(pid);
                return; // 暂停流程，等待许愿完成
            }
        }
        updateUI();
        prepareNextTurn();
    }
    
    function applyEventEffect(pid, effect) {
        const p = state.players[pid];
        if(effect === 'draw2') drawCards(pid, 2);
        if(effect === 'blackhole') { state.players.forEach(pl => { if(pl.id !== pid && pl.hand.length > 0) state.deck.push(pl.hand.pop()); }); shuffle(state.deck); log("黑洞触发：全场重洗"); }
        if(effect === 'drawRocket') { const count = p.combos.filter(c => c.type === 'Moon' && c.round === state.round).length; if(count>0) { drawCards(pid, count); log(`摘星揽月：抽 ${count} 张`); } }
        if(effect === 'drawStone') { const count = p.combos.filter(c => c.type === 'Attack' && c.round === state.round).length; if(count>0) { drawCards(pid, count); log(`小行星带：抽 ${count} 张`); } }
        if(effect === 'scoreStars') { const count = p.combos.filter(c => c.type === 'Star' && c.round === state.round).length; p.score += count * 3; log(`星辰闪耀：+${count*3} 分`); }
    }

    function handleWish(pid) {
        showModal(`${state.players[pid].name} 许愿`, "请选择愿望", 
            [{name:'贪婪', desc:'抽 2 张', icon:'🃏'}, {name:'声望', desc:'+3 分', icon:'🏆'}, {name:'野心', desc:'抽终极目标', icon:'📜'}].map(x=>({...x, type:'Event'})),
            (idx) => {
                hideModal();
                if(idx===0) { drawCards(pid, 2); log("许愿：抽了2张牌"); }
                if(idx===1) { state.players[pid].score += 3; log("许愿：获得3分"); }
                if(idx===2) {
                    if(state.ultimateDeck.length > 0) {
                        const ult = state.ultimateDeck.pop();
                        state.players[pid].ultimateObjs.push(ult);
                        state.players[pid].combos.push({name:'终极目标', type:'Ultimate', data:ult, endScore:0});
                        alert(`获得：${ult.name}`);
                    } else { alert("目标卡没了，补偿抽牌"); drawCards(pid, 2); }
                }
                updateUI();
                prepareNextTurn(); // 许愿完后才切回合
            }
        );
    }
    
    function drawCards(pid, num) { for(let i=0; i<num; i++) if(state.deck.length>0) state.players[pid].hand.push(state.deck.pop()); }

    function enterTargetingMode() { 
        state.targetingMode = true; 
        document.getElementById('targeting-overlay').style.display = 'flex'; 
        updateUI(); 
    }
    
    window.handleTokenClick = function(targetPid, comboIdx) {
        if(!state.targetingMode) return;
        if(targetPid === state.currentPlayer) { alert("不能摧毁自己的组合！"); return; }
        const targetP = state.players[targetPid];
        // [修复] 这里由于combos排序了，index可能不对应，需要小心
        // 为了简化，我们暂时假设 updateUI 渲染时的 index 和实际数组 index 是一致的。
        // 但我们在 updateUI 里加了 sort，这会导致点击错乱。
        // 修正方案：不在 updateUI 渲染时 sort 数组本身，而是 copy 一份 sort 后的数组用于显示。
        // 但为了实现“点击”，我们需要知道原始 index。
        // 简单改法：Token 带上原始 index。
        
        // 由于下方的 sortedCombos 逻辑，这里我们需要根据 DOM 里的 data-original-index 来操作。
        // 但 createToken HTML 比较难传参。
        // 替代方案：targetingMode 下，暂时不排序，或者直接遍历查找。
        // 最稳妥方案：在 targetingMode 下，直接点那个 token，删除该 token 对应的 combo 对象。
        
        // 这里的 comboIdx 是 sorted 后的 index。我们需要找到原始对象。
        // 让我们稍微修改 updateUI 里的逻辑来支持这个。
    }

    function endRoundLogic() {
        log(`=== 第 ${state.round} 回合结束 ===`);
        let recycleBin = [...state.deck, ...state.discardPile];
        state.players.forEach(p => {
            const handScore = p.hand.reduce((s,c) => s+(c.score||0), 0);
            p.score += handScore;
            p.hand.forEach(c => c.selected = false);
            recycleBin = recycleBin.concat(p.hand);
            p.hand = [];
            p.combos.forEach(c => { 
                if(c.cards) { c.cards.forEach(card => card.selected = false); recycleBin = recycleBin.concat(c.cards); }
                c.cards = []; 
            });
        });
        
        recycleBin.forEach(c => c.selected = false);
        state.deck = shuffle(recycleBin);
        state.discardPile = [];
        const potentialWinner = state.players.find(p => calculateFinalScore(p).total >= state.targetScore);
        if(potentialWinner || state.round >= state.maxRounds) {
            setTimeout(endGame, 1000);
        } else {
            state.round++;
            setTimeout(startRound, 2000);
        }
    }
    
    function calculateFinalScore(p) {
        let breakdown = { current: p.score, combo: 0, nebula: 0, objective: 0, total: 0 };
        breakdown.combo = p.combos.filter(c => c.type !== 'Nebula').reduce((s,c) => s+(c.endScore||0), 0);
        const nebulaCount = p.combos.filter(c => c.type === 'Nebula').length;
        breakdown.nebula = nebulaCount * (nebulaCount + 2); 
        if(p.objective && p.objective.check(p.combos)) breakdown.objective += p.objective.bonus;
        p.combos.filter(c => c.type === 'Ultimate').forEach(u => {
             const stars = p.combos.filter(c=>c.type==='Star').length;
             const meteors = p.combos.filter(c=>c.type==='Meteor').length;
             const attacks = p.combos.filter(c=>c.type==='Attack').length;
             const moons = p.combos.filter(c=>c.type==='Moon').length;
             if(u.data.name === '宇宙网') { if(stars>=2 && meteors>=2 && attacks>=2 && moons>=2) breakdown.objective += 40; } 
             else if(u.data.name === '河外丝状结构') { if(stars>=4 && meteors>=2 && (attacks>=1 || moons>=1)) breakdown.objective += 30; }
        });
        breakdown.total = breakdown.current + breakdown.combo + breakdown.nebula + breakdown.objective;
        return breakdown;
    }

    function endGame() {
        state.gamePhase = 'END';
        log("=== 最终计分 ===");
        let msg = "";
        let winner = state.players[0];
        let maxScore = -1;

        state.players.forEach(p => {
            const finalStats = calculateFinalScore(p);
            p.score = finalStats.total;
            if(p.score > maxScore) { maxScore = p.score; winner = p; }
            msg += `<div style="margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">
                <div style="font-weight:bold; color:#facc15">${p.name}: ${finalStats.total}分</div>
                <div style="font-size:12px; color:#cbd5e1">基础:${finalStats.current} | 组合:${finalStats.combo} | 星云:${finalStats.nebula} | 目标:${finalStats.objective}</div>
            </div>`;
        });
        
        document.getElementById('winner-name').innerText = `🏆 冠军: ${winner.name}`;
        document.getElementById('final-scores').innerHTML = msg;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    function updateUI() {
        document.getElementById('round-badge').innerText = `Round ${state.round} / ${state.maxRounds}`;
        document.getElementById('phase-badge').innerText = state.gamePhase === 'DRAFT' ? '轮抽' : '出牌';
        document.getElementById('current-player-badge').innerText = `当前：${state.players[state.currentPlayer].name}`;
        
        const p = state.players[state.currentPlayer];
        const hud = document.getElementById('objective-content');
        let html = '';
        if(p.objective) html += `<div class="hud-item"><strong style="color:#facc15">${p.objective.name}</strong><br>${p.objective.desc}</div>`;
        p.ultimateObjs.forEach(u => { html += `<div class="hud-item"><strong style="color:#f472b6">${u.name}</strong><br>${u.desc}</div>`; });
        hud.innerHTML = html || '无';

        const handDiv = document.getElementById('player-hand');
        document.getElementById('hand-owner-label').innerText = `${p.name} 的手牌`;
        handDiv.innerHTML = '';
        p.hand.forEach(c => { handDiv.appendChild(createCardElement(c)); });

        const scoreBody = document.getElementById('score-body');
        scoreBody.innerHTML = '';
        state.players.forEach(pl => {
            // [修复] 计分板排序显示，并处理点击事件的索引对应
            // 策略：创建一个带有原始索引的临时数组进行排序
            let indexedCombos = pl.combos.map((c, i) => ({...c, originalIndex: i}));
            
            // 排序：星星 > 流星 > 登月 > 陨石 > 星云
            const typeOrder = {'Star':1, 'Meteor':2, 'Moon':3, 'Attack':4, 'Nebula':5, 'Ultimate':6};
            indexedCombos.sort((a, b) => (typeOrder[a.type]||99) - (typeOrder[b.type]||99));

            let comboHtml = indexedCombos.map((c) => {
                const isTarget = state.targetingMode && pl.id !== state.currentPlayer; 
                let tokenClass = `token-${c.type}`;
                // 注意：这里 onclick 传的是 c.originalIndex，确保删除的是正确的对象
                return `<span class="combo-token ${tokenClass} ${isTarget?'targetable':''}" ${isTarget ? `onclick="handleClickDestroy(${pl.id}, ${c.originalIndex})"` : ''}>${c.name}</span>`;
            }).join('');
            
            const activeClass = (pl.id === state.currentPlayer) ? 'active-row' : '';
            scoreBody.innerHTML += `<tr class="${activeClass}"><td style="${activeClass?'color:#facc15;font-weight:bold':''}">${pl.name} ${pl.passed?'(Pass)':''}</td><td style="font-weight:bold; color:#facc15">${pl.score}</td><td>${comboHtml || '-'}</td></tr>`;
        });
    }

    // 新的点击销毁处理函数
    window.handleClickDestroy = function(targetPid, originalIndex) {
        if(!state.targetingMode) return;
        const targetP = state.players[targetPid];
        const combo = targetP.combos[originalIndex];
        
        if(confirm(`摧毁 ${targetP.name} 的 [${combo.name}] ?`)) {
            // 移除
            targetP.combos.splice(originalIndex, 1);
            if(combo.cards) combo.cards.forEach(c => state.deck.unshift(c));
            
            log(`${state.players[state.currentPlayer].name} 摧毁了 ${targetP.name} 的组合`);
            
            state.targetingMode = false;
            document.getElementById('targeting-overlay').style.display = 'none';
            updateUI();
            prepareNextTurn();
        }
    }

    function createCardElement(c) {
        const div = document.createElement('div');
        div.className = `card ${c.selected?'selected':''}`;
        const elFn = () => { 
            if(state.gamePhase==='PLAY' && !state.targetingMode) { 
                c.selected = !c.selected; 
                updateUI(); 
            } 
        };
        const imgSrc = c.img || 'event.jpg';
        if(c.type === 'Objective' || c.type === 'Ultimate') {
            div.innerHTML = `<div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px; background:#0f172a;"><div style="font-size:30px; margin-bottom:10px;">📜</div><div style="font-weight:bold; color:#facc15; font-size:12px;">${c.name}</div><div style="font-size:10px; color:#cbd5e1; margin-top:5px;">${c.desc}</div></div>`;
        } else {
            div.innerHTML = `
                <div class="card-img-box"><img src="${imgSrc}" onerror="this.src='bg.jpg'"></div>
                <div class="card-info">
                    <div class="card-name">${c.name}</div>
                    <div class="card-desc">${c.desc||''}</div>
                </div>`;
        }
        div.onclick = elFn;
        return div;
    }

    function showModal(title, desc, choices, callback) {
        const m = document.getElementById('modal-window');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const body = document.getElementById('modal-body');
        body.innerHTML = '';
        choices.forEach((c, idx) => {
            const el = createCardElement(c);
            el.onclick = () => callback(idx);
            body.appendChild(el);
        });
        m.style.display = 'flex';
    }
    function hideModal() { document.getElementById('modal-window').style.display = 'none'; }
    function showCurtain(nextPlayerId, reason) {
        const curtain = document.getElementById('turn-curtain');
        const msg = document.getElementById('curtain-msg');
        const sub = document.getElementById('curtain-sub');
        const btn = curtain.querySelector('button');
        msg.innerText = `${state.players[nextPlayerId].name}`;
        sub.innerText = reason || "请将设备交给该玩家";
        btn.onclick = () => {
            curtain.style.display = 'none';
            if(state.gamePhase === 'DRAFT') { showDraftScreen(nextPlayerId); } else { updateUI(); checkTurn(); }
        };
        curtain.style.display = 'flex';
    }
    function hideCurtain() { document.getElementById('turn-curtain').style.display = 'none'; }
    function log(m) { const d=document.getElementById('game-log'); d.innerHTML+=`<div>> ${m}</div>`; d.scrollTop=d.scrollHeight; }

    function validateCombo(cards) {
        const types = cards.map(c => c.type);
        const len = cards.length;
        if(len === 1 && cards[0].isEvent) {
            if(cards[0].effect === 'meteorShower') return {valid:false, reason:"流星雨事件卡不能单独打出"};
            return {valid:true, type:'Event', data:cards[0]};
        }
        if(len===3 && types.every(t=>t==='Star')) return {valid:true, type:'Star', name:'星座组合', endScore:5};
        if(len===3 && types.every(t=>t==='Meteor')) return {valid:true, type:'Meteor', name:'流星许愿', endScore:3};
        if(len===2 && types.every(t=>t==='Nebula')) return {valid:true, type:'Nebula', name:'星云(成长)', endScore:0}; 
        if(cards.some(c=>c.effect==='meteorShower') && len===3 && types.includes('Meteor') && types.includes('Event')) return {valid:true, type:'Meteor', name:'流星雨(事件)', endScore:3, reqDiscard:true};
        if(len===2 && types.includes('Astronaut') && types.includes('Rocket')) return {valid:true, type:'Moon', name:'登月成功', endScore:4};
        if(len===2 && types.includes('Meteorite') && types.includes('Star')) return {valid:true, type:'Attack', name:'陨石打击', endScore:0};
        return {valid:false, reason:"不符合规则"};
    }

    initGame();
</script>
